<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>System Hub | Control Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/hub-core.css">
</head>
<body>

    <header class="hub-navbar shadow-sm">
    <div class="d-flex align-items-center px-3 w-100">
        <span class="navbar-brand fw-bold">SYSTEM<span class="text-primary">HUB</span></span>
        
        <div class="ms-4 position-relative d-none d-md-block" style="width: 300px;">
            <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
            <input type="text" id="global-search" class="form-control form-control-sm bg-dark border-secondary ps-5 rounded-pill text-white" 
                   placeholder="Cerca strumento (Premi /)">
        </div>

        <div class="ms-auto d-flex align-items-center gap-3">
            <span id="user-greeting" class="small fw-medium">Ospite</span>
            <i class="bi bi-person-circle fs-5"></i>
        </div>
    </div>
</header>

    <div class="container-fluid p-0">
        <div class="row g-0">
            <nav class="col-md-2 d-md-block hub-sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column" id="hub-menu">
                        </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto px-md-4 py-4" id="hub-viewport">
                <div id="loader" class="text-center mt-5 d-none">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
                <div id="tool-container"></div>
            </main>
        </div>
    </div>

    <script src="js/hub-logic.js"></script>
</body>
</html>
