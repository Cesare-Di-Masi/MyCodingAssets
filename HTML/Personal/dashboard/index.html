<!doctype html>
<html lang="it" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TechHub 5.5 - Dynamic Control Center</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-sidebar: #000000;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #facc15;
            --accent-hover: #eab308;
            --sidebar-text: #94a3b8;
            --sidebar-active: #ffffff;
            --border-color: rgba(0, 0, 0, 0.05);
            --glass-bg: rgba(255, 255, 255, 0.8);
            --sidebar-width: 280px;
        }

        [data-bs-theme="dark"] {
            --bg-primary: #000000;
            --bg-secondary: #0f172a;
            --bg-sidebar: #111111;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #facc15;
            --accent-hover: #eab308;
            --sidebar-text: #64748b;
            --sidebar-active: #facc15;
            --border-color: rgba(255, 255, 255, 0.05);
            --glass-bg: rgba(15, 23, 42, 0.8);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        #sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            left: 0; top: 0;
            background: var(--bg-sidebar);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .brand-logo {
            padding: 3rem 2rem;
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            text-decoration: none;
            letter-spacing: -1px;
            text-transform: uppercase;
        }
        .brand-logo span { color: var(--accent); }

        #hub-menu { 
            padding: 0.5rem 1.2rem; 
            flex-grow: 1; 
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }

        #hub-menu::-webkit-scrollbar { width: 4px; }
        #hub-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        
        #hub-menu .nav-link {
            color: var(--sidebar-text);
            padding: 0.85rem 1.2rem;
            margin-bottom: 0.5rem;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
        }

        #hub-menu .nav-link i {
            font-size: 1.1rem;
            transition: transform 0.3s ease;
        }

        #hub-menu .nav-link:hover {
            color: #fff;
            background: rgba(255,255,255,0.03);
            border-color: rgba(255,255,255,0.05);
            transform: translateX(4px);
        }

        #hub-menu .nav-link:hover i {
            transform: scale(1.1);
            color: var(--accent);
        }

        #hub-menu .nav-link.active {
            color: #000;
            background: var(--accent);
            box-shadow: 0 10px 25px rgba(250, 204, 21, 0.25);
            border-color: var(--accent);
        }

        #hub-menu .nav-link.active i {
            color: #000;
        }

        .category-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #475569;
            margin: 2rem 0 0.8rem 1.4rem;
            font-weight: 900;
            opacity: 0.8;
        }

        .profile-section {
            padding: 1.5rem;
            margin: 1rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .profile-section:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
        }

        #main-wrapper {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
        }

        header {
            position: sticky; top: 0; z-index: 999;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2.5rem;
        }

        .search-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.6rem 1.2rem;
            width: 350px;
        }
        .search-box input {
            background: none; border: none; outline: none;
            color: var(--text-main); font-size: 0.9rem; width: 100%;
        }

        #tool-container { padding: 3rem; }

        .theme-toggle {
            width: 42px; height: 42px;
            border-radius: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }
        .theme-toggle:hover { background: var(--accent); color: #000; border-color: var(--accent); }

        .btn-accent {
            background: var(--accent);
            color: #000;
            font-weight: 700;
            border-radius: 12px;
            padding: 0.6rem 1.5rem;
            border: none;
            transition: transform 0.2s;
        }
        .btn-accent:hover { background: var(--accent-hover); transform: translateY(-2px); }

        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 992px) {
            #sidebar { transform: translateX(-100%); }
            #sidebar.show { transform: translateX(0); }
            #main-wrapper { margin-left: 0; }
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <a href="#dashboard" onclick="navigateTo('dashboard')" class="brand-logo">TECH<span>HUB</span></a>
        <nav id="hub-menu"></nav>
        <div class="profile-section mt-auto">
            <div class="d-flex align-items-center gap-3">
                <img src="" class="rounded-circle border border-2 border-white border-opacity-10" width="42" height="42" id="side-avatar">
                <div class="overflow-hidden">
                    <p class="mb-0 small fw-800 text-white text-truncate" id="side-user-name">Guest User</p>
                    <div class="d-flex align-items-center gap-1 opacity-50">
                        <span class="bg-success rounded-circle" style="width: 6px; height: 6px;"></span>
                        <span style="font-size: 0.65rem; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Verified Admin</span>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <div id="main-wrapper">
        <header class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-dark d-lg-none" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                <div class="search-box d-none d-md-flex align-items-center gap-2">
                    <i class="bi bi-search text-muted"></i>
                    <input type="text" id="global-search" placeholder="Quick search...">
                </div>
            </div>

            <div class="d-flex align-items-center gap-3">
                <div class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
                    <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
                </div>
                <button class="btn btn-accent px-3 d-none d-sm-block">
                    <i class="bi bi-lightning-charge-fill me-1"></i> Upgrade
                </button>
            </div>
        </header>

        <main id="tool-container"></main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/hub-logic.js"></script>
    <script>
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('show'); }
        
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const isDark = html.getAttribute('data-bs-theme') === 'dark';
            
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', newTheme);
            icon.className = isDark ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
            localStorage.setItem('hub-theme', newTheme);
        }

        const savedTheme = localStorage.getItem('hub-theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
        document.getElementById('theme-icon').className = savedTheme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';

        window.addEventListener('profileUpdated', () => {
            const p = JSON.parse(localStorage.getItem('hub-profile-data')) || { nome: 'Guest', cognome: 'User' };
            document.getElementById('side-user-name').textContent = `${p.nome} ${p.cognome}`;
            document.getElementById('side-avatar').src = `https://ui-avatars.com/api/?name=${p.nome}+${p.cognome}&background=facc15&color=000&bold=true`;
        });
        window.dispatchEvent(new Event('profileUpdated'));
    </script>
</body>
</html>
