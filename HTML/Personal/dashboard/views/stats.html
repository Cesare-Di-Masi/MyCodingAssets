<div class="animate-fade-in">
    <div class="row mb-5">
        <div class="col-12">
            <h1 class="fw-800 mb-1">Settings</h1>
            <p class="text-muted mb-0">Manage system preferences and user identity.</p>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-5 mb-4">
                <h5 class="fw-bold mb-4 d-flex align-items-center">
                    <i class="bi bi-person-circle me-3 text-accent" style="color: #818cf8;"></i> User Identity
                </h5>
                
                <form id="profile-form">
                    <div class="d-flex align-items-center mb-5 bg-dark bg-opacity-25 p-4 rounded-4 border border-white border-opacity-5">
                        <img src="https://ui-avatars.com/api/?name=Ospite&background=6366f1&color=fff" id="profile-avatar" alt="Avatar" class="rounded-circle me-4 shadow-lg border border-4 border-secondary border-opacity-25" width="100" height="100">
                        <div>
                            <h4 class="fw-bold mb-1" id="display-name">Guest User</h4>
                            <p class="text-muted small mb-3">System Administrator</p>
                            <button type="button" class="btn btn-dark btn-sm rounded-pill px-3 fw-bold border border-white border-opacity-10">Upload New</button>
                        </div>
                    </div>

                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="small text-muted fw-800 text-uppercase mb-2" style="letter-spacing: 0.1em;">First Name</label>
                            <input type="text" class="form-control bg-dark bg-opacity-50 border-0 text-white p-3 rounded-3" id="inputNome" required>
                        </div>
                        <div class="col-md-6">
                            <label class="small text-muted fw-800 text-uppercase mb-2" style="letter-spacing: 0.1em;">Last Name</label>
                            <input type="text" class="form-control bg-dark bg-opacity-50 border-0 text-white p-3 rounded-3" id="inputCognome" required>
                        </div>
                        <div class="col-12">
                            <label class="small text-muted fw-800 text-uppercase mb-2" style="letter-spacing: 0.1em;">Email Address</label>
                            <input type="email" class="form-control bg-dark bg-opacity-50 border-0 text-white p-3 rounded-3" id="inputEmail" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-5">
                        <div id="save-status" class="text-success small fw-bold" style="opacity: 0; transition: all 0.3s ease;">
                            <i class="bi bi-check-circle-fill me-1"></i> Preferences Saved
                        </div>
                        <button type="submit" class="btn btn-indigo rounded-pill px-5 py-3 fw-bold shadow-lg" style="background: var(--accent); border: none;">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 mb-4">
                <h6 class="small fw-800 text-uppercase mb-4 opacity-50" style="letter-spacing: 0.1em;">Global Preferences</h6>
                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" id="darkModeSwitch" checked disabled>
                    <label class="form-check-label text-muted" for="darkModeSwitch">Dark Mode (Always On)</label>
                </div>
                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" id="notifySwitch" checked>
                    <label class="form-check-label" for="notifySwitch">System Notifications</label>
                </div>
                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" id="telemetrySwitch">
                    <label class="form-check-label" for="telemetrySwitch">Anonymous Telemetry</label>
                </div>
                
                <hr class="border-white border-opacity-10 my-4">
                
                <button class="btn btn-outline-danger w-100 rounded-pill py-2 fw-bold small" onclick="resetHub()">
                    <i class="bi bi-radioactive me-2"></i> Factory Reset Hub
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const form = document.getElementById('profile-form');
        const inputNome = document.getElementById('inputNome');
        const inputCognome = document.getElementById('inputCognome');
        const inputEmail = document.getElementById('inputEmail');
        const avatar = document.getElementById('profile-avatar');
        const statusMsg = document.getElementById('save-status');
        const displayName = document.getElementById('display-name');

        const profile = JSON.parse(localStorage.getItem('hub-profile-data')) || {
            nome: 'Guest',
            cognome: 'User',
            email: 'admin@techhub.v5'
        };

        inputNome.value = profile.nome;
        inputCognome.value = profile.cognome;
        inputEmail.value = profile.email;
        updateUI(profile.nome, profile.cognome);

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const newData = { nome: inputNome.value, cognome: inputCognome.value, email: inputEmail.value };
            localStorage.setItem('hub-profile-data', JSON.stringify(newData));
            updateUI(newData.nome, newData.cognome);
            logActivity('Settings', 'User profile updated');
            window.dispatchEvent(new Event('profileUpdated'));
            
            statusMsg.style.opacity = '1';
            setTimeout(() => { statusMsg.style.opacity = '0'; }, 2000);
        });

        function updateUI(n, c) {
            displayName.textContent = `${n} ${c}`;
            avatar.src = `https://ui-avatars.com/api/?name=${n}+${c}&background=6366f1&color=fff&bold=true`;
        }
    })();

    function resetHub() {
        if (confirm('CRITICAL: This will wipe all local data, tasks, and settings. Continue?')) {
            localStorage.clear();
            window.location.reload();
        }
    }
</script>
