<div class="animate-fade-in">
    <div class="row mb-5 align-items-center">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">Focus Engine <span class="badge bg-accent text-black small">PRO</span></h1>
            <p class="text-muted mb-0">High-performance deep work timer with automated rest cycles.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <div class="btn-group rounded-4 overflow-hidden shadow-sm">
                <button class="btn btn-dark active px-3 py-2 fw-800 small" id="mode-focus" onclick="setPomMode('focus')">FOCUS</button>
                <button class="btn btn-dark px-3 py-2 fw-800 small" id="mode-short" onclick="setPomMode('short')">SHORT</button>
                <button class="btn btn-dark px-3 py-2 fw-800 small" id="mode-long" onclick="setPomMode('long')">LONG</button>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-5 p-5 text-center shadow-lg position-relative overflow-hidden">
                <!-- SVG Progress Ring -->
                <div class="position-relative mb-5 d-flex justify-content-center align-items-center">
                    <svg width="280" height="280" viewBox="0 0 280 280" class="position-absolute">
                        <circle cx="140" cy="140" r="130" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="12" />
                        <circle id="pom-progress" cx="140" cy="140" r="130" fill="none" stroke="var(--accent)" stroke-width="12" 
                                stroke-dasharray="816" stroke-dashoffset="0" stroke-linecap="round" 
                                style="transition: stroke-dashoffset 1s linear; transform: rotate(-90deg); transform-origin: 50% 50%;" />
                    </svg>
                    <div class="z-1">
                        <h6 class="small fw-900 text-uppercase tracking-wider opacity-50 mb-2" id="pom-label">Deep Work</h6>
                        <h1 class="display-1 fw-900 mb-0 font-monospace tracking-tight" id="pom-timer">25:00</h1>
                    </div>
                </div>
                
                <div class="d-flex justify-content-center gap-3 z-1">
                    <button class="btn btn-accent btn-lg px-5 py-3 fw-900 rounded-4 shadow-accent" onclick="togglePom()" id="pom-main-btn">
                        <i class="bi bi-play-fill me-2"></i> START
                    </button>
                    <button class="btn btn-dark btn-lg border border-white border-opacity-10 px-4 py-3 rounded-4" onclick="resetPom()">
                        <i class="bi bi-arrow-counterclockwise"></i>
                    </button>
                </div>

                <div class="mt-5 pt-4 border-top border-white border-opacity-5 d-flex justify-content-around">
                    <div class="text-center">
                        <p class="small fw-800 text-muted mb-1">SESSION</p>
                        <h5 class="fw-800 mb-0" id="session-count">#1</h5>
                    </div>
                    <div class="text-center">
                        <p class="small fw-800 text-muted mb-1">TOTAL</p>
                        <h5 class="fw-800 mb-0" id="total-focus">0m</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .shadow-accent { box-shadow: 0 10px 30px rgba(250, 204, 21, 0.2); }
    .btn-dark.active { background: var(--accent) !important; color: black !important; }
    .tracking-tight { letter-spacing: -4px; }
</style>

<script>
    (function() {
        let timer = null;
        let isRunning = false;
        let currentMode = 'focus';
        let timeLeft = 25 * 60;
        let totalSeconds = 25 * 60;
        let sessionsCompleted = parseInt(localStorage.getItem('hub-pom-sessions') || '0');
        let cumulativeFocus = parseInt(localStorage.getItem('hub-pom-focus') || '0');

        document.getElementById('session-count').textContent = `#${sessionsCompleted + 1}`;
        document.getElementById('total-focus').textContent = `${Math.floor(cumulativeFocus / 60)}m`;

        const modes = {
            focus: { time: 25 * 60, label: 'Deep Work' },
            short: { time: 5 * 60, label: 'Short Break' },
            long: { time: 15 * 60, label: 'Long Break' }
        };

        window.setPomMode = (m) => {
            if(isRunning) togglePom();
            currentMode = m;
            timeLeft = modes[m].time;
            totalSeconds = modes[m].time;
            
            // UI Updates
            document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`mode-${m}`).classList.add('active');
            document.getElementById('pom-label').textContent = modes[m].label;
            
            updateDisplay();
        }

        window.togglePom = () => {
            const btn = document.getElementById('pom-main-btn');
            if(isRunning) {
                clearInterval(timer);
                btn.innerHTML = '<i class="bi bi-play-fill me-2"></i> START';
            } else {
                timer = setInterval(tick, 1000);
                btn.innerHTML = '<i class="bi bi-pause-fill me-2"></i> PAUSE';
                logActivity('Productivity', `Pomodoro ${currentMode} started`);
            }
            isRunning = !isRunning;
        }

        window.resetPom = () => {
            if(isRunning) togglePom();
            timeLeft = modes[currentMode].time;
            updateDisplay();
        }

        function tick() {
            if(timeLeft <= 0) {
                completeSession();
                return;
            }
            timeLeft--;
            if(currentMode === 'focus') {
                cumulativeFocus++;
                if (cumulativeFocus % 60 === 0) {
                    localStorage.setItem('hub-pom-focus', cumulativeFocus);
                }
            }
            updateDisplay();
        }

        function completeSession() {
            clearInterval(timer);
            isRunning = false;
            new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play();
            
            if(currentMode === 'focus') {
                sessionsCompleted++;
                localStorage.setItem('hub-pom-sessions', sessionsCompleted);
                document.getElementById('session-count').textContent = `#${sessionsCompleted + 1}`;
            }
            
            document.getElementById('pom-main-btn').innerHTML = '<i class="bi bi-play-fill me-2"></i> START';
            alert(`${modes[currentMode].label} Complete!`);
            resetPom();
        }

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('pom-timer').textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            
            // Update Progress Ring
            const offset = 816 - (timeLeft / totalSeconds) * 816;
            document.getElementById('pom-progress').style.strokeDashoffset = offset;
            
            // Update Total Focus
            document.getElementById('total-focus').textContent = `${Math.floor(cumulativeFocus / 60)}m`;
        }

        updateDisplay();
    })();
</script>
