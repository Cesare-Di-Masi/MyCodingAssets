<div class="animate-fade-in">
    <div class="row mb-5">
        <div class="col-7">
            <h1 class="fw-800 mb-1">Local Vault</h1>
            <p class="text-muted mb-0">Securely store secrets in your browser's local storage.</p>
        </div>
        <div class="col-5 text-end">
            <button class="btn btn-accent px-4 py-2 fw-bold" onclick="addNewSecret()">
                <i class="bi bi-shield-plus me-1"></i> Add Secret
            </button>
        </div>
    </div>

    <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 mb-4">
        <div class="row g-4" id="vault-list">
            <!-- Secrets go here -->
        </div>
    </div>
</div>

<script>
    (function() {
        let secrets = JSON.parse(localStorage.getItem('hub-vault') || '[]');

        window.renderVault = function() {
            const list = document.getElementById('vault-list');
            if(secrets.length === 0) {
                list.innerHTML = `<div class="col-12 text-center py-5 text-muted">No secrets stored in this vault.</div>`;
                return;
            }
            list.innerHTML = secrets.map((s, i) => `
                <div class="col-md-6 col-lg-4">
                    <div class="card bg-dark border-0 rounded-4 p-3 shadow-sm h-100">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge bg-accent text-black fw-bold">${s.label}</span>
                            <button class="btn btn-sm text-danger border-0 p-0" onclick="deleteSecret(${i})"><i class="bi bi-trash"></i></button>
                        </div>
                        <div class="input-group">
                            <input type="password" class="form-control bg-transparent border-secondary text-white font-monospace" value="${s.value}" readonly id="secret-${i}">
                            <button class="btn btn-outline-secondary" onclick="toggleSecret(${i})">
                                <i class="bi bi-eye" id="icon-${i}"></i>
                            </button>
                            <button class="btn btn-outline-secondary" onclick="copySecret(${i})">
                                <i class="bi bi-clipboard"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
            localStorage.setItem('hub-vault', JSON.stringify(secrets));
        }

        window.addNewSecret = function() {
            const label = prompt("Label for this secret (e.g., API Key, Root Pass):");
            const value = prompt("Enter the secret value:");
            if(label && value) {
                secrets.push({ label, value });
                renderVault();
                logActivity('Security', 'Added secret to vault: ' + label);
            }
        }

        window.deleteSecret = function(i) {
            if(confirm('Delete this secret?')) {
                secrets.splice(i, 1);
                renderVault();
            }
        }

        window.toggleSecret = function(i) {
            const input = document.getElementById(`secret-${i}`);
            const icon = document.getElementById(`icon-${i}`);
            if(input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        window.copySecret = function(i) {
            const val = secrets[i].value;
            navigator.clipboard.writeText(val);
            // Could show a toast, but keeping it simple
        }

        renderVault();
    })();
</script>
