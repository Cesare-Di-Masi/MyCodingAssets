<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">SVG Editor</h1>
            <p class="text-muted mb-0">Visualize and clean up SVG code with live preview.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <button class="btn btn-accent px-4 py-2 fw-bold" onclick="copySVG()">
                <i class="bi bi-clipboard me-1"></i> Copy Code
            </button>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card border-0 rounded-4 shadow-sm" style="background: var(--bg-secondary);">
                <div class="card-header bg-transparent border-white border-opacity-5 p-3">
                    <span class="small fw-800 text-uppercase opacity-50 px-2">SVG Source</span>
                </div>
                <div class="card-body p-0">
                    <textarea id="svg-input" class="form-control bg-transparent border-0 p-4 font-monospace" 
                              style="height: 500px; color: var(--text-main); font-size: 0.9rem; resize: none;" 
                              placeholder="<svg>...</svg>" oninput="renderSVG()"></textarea>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card border-0 rounded-4 shadow-sm h-100" style="background: var(--bg-secondary);">
                <div class="card-header bg-transparent border-white border-opacity-5 p-3">
                    <span class="small fw-800 text-uppercase opacity-50 px-2">Live Preview</span>
                </div>
                <div class="card-body d-flex align-items-center justify-content-center" id="svg-preview" style="min-height: 500px;">
                    <div class="text-muted small">SVG preview will appear here...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const inputEl = document.getElementById('svg-input');
        const preview = document.getElementById('svg-preview');

        // Load saved state
        inputEl.value = localStorage.getItem('hub-svg-input') || '<svg width="100" height="100" viewBox="0 0 100 100">\n  <circle cx="50" cy="50" r="40" stroke="#facc15" stroke-width="4" fill="none" />\n</svg>';

        window.renderSVG = function(isSilent = false) {
            const input = inputEl.value;
            localStorage.setItem('hub-svg-input', input);
            preview.innerHTML = input || '<div class="text-muted small">SVG preview will appear here...</div>';
            
            if (!isSilent && input) {
                logActivity('SVG Editor', 'Updated SVG preview');
            }
        }

        window.copySVG = function() {
            inputEl.select();
            document.execCommand('copy');
            alert('Copied to clipboard!');
        }

        renderSVG(true);
    })();
</script>
