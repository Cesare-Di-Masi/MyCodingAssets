<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">DNS Checker</h1>
            <p class="text-muted mb-0">Lookup DNS records (A, MX, CNAME, TXT) via Google DNS API.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <div class="d-inline-flex bg-secondary bg-opacity-10 p-2 rounded-4 border border-white border-opacity-5">
                <select id="dns-type" class="form-select bg-transparent border-0 text-white fw-bold" style="width: 100px;">
                    <option value="A">A</option>
                    <option value="MX">MX</option>
                    <option value="CNAME">CNAME</option>
                    <option value="TXT">TXT</option>
                </select>
                <input type="text" id="dns-domain" class="form-control bg-transparent border-0 text-white" placeholder="google.com" style="width: 200px;">
                <button class="btn btn-accent rounded-3 px-3" onclick="checkDNS()">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4">
                <div id="dns-results" class="font-monospace small text-white">
                    <div class="text-muted small">Search results will appear here...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const typeEl = document.getElementById('dns-type');
        const domainEl = document.getElementById('dns-domain');
        const results = document.getElementById('dns-results');

        // Load saved state
        typeEl.value = localStorage.getItem('hub-dns-type') || 'A';
        domainEl.value = localStorage.getItem('hub-dns-domain') || '';

        window.checkDNS = async function(isSilent = false) {
            const domain = domainEl.value.trim();
            const type = typeEl.value;
            if(!domain) return;

            localStorage.setItem('hub-dns-type', type);
            localStorage.setItem('hub-dns-domain', domain);

            results.innerHTML = `<div class="spinner-border spinner-border-sm text-accent me-2"></div> Looking up ${type} records for ${domain}...`;

            try {
                const response = await fetch(`https://dns.google/resolve?name=${domain}&type=${type}`);
                const data = await response.json();
                
                results.innerHTML = '';
                if (data.Answer) {
                    data.Answer.forEach(ans => {
                        const item = document.createElement('div');
                        item.className = 'mb-2 p-3 bg-dark bg-opacity-25 rounded-3 border-start border-3 border-accent';
                        
                        const ttl = document.createElement('span');
                        ttl.className = 'text-muted me-3';
                        ttl.textContent = `TTL: ${ans.TTL}`;
                        
                        const val = document.createElement('span');
                        val.className = 'fw-bold';
                        val.textContent = ans.data;
                        
                        item.appendChild(ttl);
                        item.appendChild(val);
                        results.appendChild(item);
                    });
                } else {
                    const warn = document.createElement('div');
                    warn.className = 'text-warning';
                    warn.textContent = `No ${type} records found for ${domain}.`;
                    results.appendChild(warn);
                }
                
                if (!isSilent) {
                    logActivity('Security', `DNS Check: ${domain} (${type})`);
                }
            } catch (e) {
                const err = document.createElement('div');
                err.className = 'text-danger';
                err.textContent = 'Error fetching DNS data.';
                results.appendChild(err);
            }
        }
    })();
</script>
