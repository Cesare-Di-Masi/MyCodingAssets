<div class="animate-fade-in">
    <div class="row mb-4 align-items-center">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">API Engine <span class="badge bg-accent text-black small">PRO</span></h1>
            <p class="text-muted mb-0">Advanced HTTP client with request history and header management.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <button class="btn btn-accent px-5 py-2 fw-bold shadow-accent" onclick="sendAPIRequest()">
                <i class="bi bi-rocket-takeoff-fill me-2"></i> EXECUTE
            </button>
        </div>
    </div>

    <!-- Request Configuration -->
    <div class="card border-0 rounded-4 shadow-sm mb-4" style="background: var(--bg-secondary);">
        <div class="card-body p-3">
            <div class="row g-2">
                <div class="col-md-2">
                    <select id="api-method" class="form-select bg-dark bg-opacity-25 border-0 text-white fw-800 py-3 rounded-3 h-100" onchange="saveAPIState()">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="PATCH">PATCH</option>
                        <option value="DELETE">DELETE</option>
                    </select>
                </div>
                <div class="col-md-10">
                    <div class="input-group h-100">
                        <span class="input-group-text bg-dark bg-opacity-25 border-0 text-muted px-3"><i class="bi bi-globe"></i></span>
                        <input type="text" id="api-url" class="form-control bg-dark bg-opacity-25 border-0 text-white py-3 fw-500" 
                               placeholder="https://api.endpoint.com/v1/resource" value="https://jsonplaceholder.typicode.com/todos/1" oninput="saveAPIState()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Request Sidebar (Tabs) -->
        <div class="col-lg-5">
            <div class="card border-0 rounded-4 shadow-sm h-100 overflow-hidden" style="background: var(--bg-secondary);">
                <div class="card-header bg-transparent border-white border-opacity-5 p-0">
                    <ul class="nav nav-tabs border-0" id="apiTab" role="tablist">
                        <li class="nav-item flex-fill">
                            <button class="nav-link active border-0 w-100 py-3 small fw-800 text-uppercase" data-bs-toggle="tab" data-bs-target="#tab-body">Body</button>
                        </li>
                        <li class="nav-item flex-fill">
                            <button class="nav-link border-0 w-100 py-3 small fw-800 text-uppercase" data-bs-toggle="tab" data-bs-target="#tab-headers">Headers</button>
                        </li>
                        <li class="nav-item flex-fill">
                            <button class="nav-link border-0 w-100 py-3 small fw-800 text-uppercase" data-bs-toggle="tab" data-bs-target="#tab-history">History</button>
                        </li>
                    </ul>
                </div>
                <div class="card-body p-0 tab-content">
                    <!-- Body Tab -->
                    <div class="tab-pane fade show active" id="tab-body">
                        <textarea id="api-body" class="form-control bg-transparent border-0 p-4 font-monospace" 
                                  style="height: 450px; color: var(--text-main); font-size: 0.85rem; resize: none;" 
                                  placeholder='{ "id": 1, "title": "Example" }' oninput="saveAPIState()"></textarea>
                    </div>
                    <!-- Headers Tab -->
                    <div class="tab-pane fade p-4" id="tab-headers">
                        <div id="headers-list" class="mb-3">
                            <!-- Header rows injected securely -->
                        </div>
                        <button class="btn btn-sm btn-outline-secondary w-100 rounded-pill" onclick="addHeaderRow()">+ Add Header</button>
                    </div>
                    <!-- History Tab -->
                    <div class="tab-pane fade p-3" id="tab-history">
                        <div id="api-history-list" class="list-group list-group-flush bg-transparent">
                            <!-- History items injected -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Response Panel -->
        <div class="col-lg-7">
            <div class="card border-0 rounded-4 shadow-sm h-100 overflow-hidden" style="background: var(--bg-secondary);">
                <div class="card-header bg-transparent border-white border-opacity-5 p-3 d-flex justify-content-between align-items-center">
                    <div>
                        <span class="small fw-800 text-uppercase opacity-50 px-2" id="res-status-label">RESPONSE</span>
                        <span id="res-code-badge" class="badge rounded-pill ms-2"></span>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-dark btn-sm rounded-circle shadow-sm" style="width: 32px; height: 32px;" onclick="copyAPIRes()" title="Copy Response"><i class="bi bi-clipboard"></i></button>
                        <button class="btn btn-dark btn-sm rounded-circle shadow-sm" style="width: 32px; height: 32px;" onclick="clearAPIRes()" title="Clear"><i class="bi bi-trash"></i></button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <textarea id="api-response" class="form-control bg-transparent border-0 p-4 font-monospace" 
                              style="height: 450px; color: var(--text-main); font-size: 0.85rem; resize: none;" 
                              readonly placeholder="Awaiting execution..."></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .nav-tabs .nav-link { 
        color: var(--text-muted); 
        background: rgba(0,0,0,0.05); 
        transition: all 0.2s; 
    }
    .nav-tabs .nav-link.active { 
        background: transparent !important; 
        color: var(--accent) !important; 
        border-bottom: 2px solid var(--accent) !important;
    }
    .list-group-item {
        background: rgba(255,255,255,0.02) !important;
        border: 1px solid rgba(255,255,255,0.05) !important;
        margin-bottom: 8px;
        border-radius: 10px !important;
        color: var(--text-muted) !important;
        transition: transform 0.2s;
        cursor: pointer;
    }
    .list-group-item:hover {
        transform: translateX(4px);
        background: rgba(255,255,255,0.05) !important;
    }
</style>

<script>
    (function() {
        let history = [];
        try {
            history = JSON.parse(localStorage.getItem('hub-api-history') || '[]');
        } catch (e) {
            console.error("Failed to parse API history", e);
            history = [];
        }

        const methodEl = document.getElementById('api-method');
        const urlEl = document.getElementById('api-url');
        const bodyEl = document.getElementById('api-body');
        const headersListEl = document.getElementById('headers-list');

        window.saveAPIState = function() {
            localStorage.setItem('hub-api-method', methodEl.value);
            localStorage.setItem('hub-api-url', urlEl.value);
            localStorage.setItem('hub-api-body', bodyEl.value);
            
            const headers = [];
            document.querySelectorAll('.header-row').forEach(row => {
                const k = row.querySelectorAll('input')[0].value;
                const v = row.querySelectorAll('input')[1].value;
                if(k) headers.push({ k, v });
            });
            localStorage.setItem('hub-api-headers', JSON.stringify(headers));
        }

        function createHeaderRow(k = '', v = '') {
            const row = document.createElement('div');
            row.className = 'row g-2 mb-2 header-row';
            
            const colKey = document.createElement('div');
            colKey.className = 'col-5';
            const inputKey = document.createElement('input');
            inputKey.type = 'text';
            inputKey.className = 'form-control form-control-sm bg-dark bg-opacity-25 border-0 text-white';
            inputKey.placeholder = 'Key';
            inputKey.value = k;
            inputKey.oninput = saveAPIState;
            colKey.appendChild(inputKey);

            const colVal = document.createElement('div');
            colVal.className = 'col-5';
            const inputVal = document.createElement('input');
            inputVal.type = 'text';
            inputVal.className = 'form-control form-control-sm bg-dark bg-opacity-25 border-0 text-white';
            inputVal.placeholder = 'Value';
            inputVal.value = v;
            inputVal.oninput = saveAPIState;
            colVal.appendChild(inputVal);

            const colAction = document.createElement('div');
            colAction.className = 'col-2 text-end';
            const btn = document.createElement('button');
            btn.className = 'btn btn-sm text-danger border-0 p-0';
            btn.innerHTML = '<i class="bi bi-x-lg"></i>';
            btn.onclick = () => { row.remove(); saveAPIState(); };
            colAction.appendChild(btn);

            row.appendChild(colKey);
            row.appendChild(colVal);
            row.appendChild(colAction);
            return row;
        }

        window.loadAPIState = function() {
            methodEl.value = localStorage.getItem('hub-api-method') || 'GET';
            urlEl.value = localStorage.getItem('hub-api-url') || 'https://jsonplaceholder.typicode.com/todos/1';
            bodyEl.value = localStorage.getItem('hub-api-body') || '';
            
            let savedHeaders = [];
            try {
                savedHeaders = JSON.parse(localStorage.getItem('hub-api-headers') || '[]');
            } catch (e) {
                console.error("Failed to parse saved headers", e);
                savedHeaders = [];
            }

            headersListEl.innerHTML = '';
            if (savedHeaders.length > 0) {
                savedHeaders.forEach(h => {
                    headersListEl.appendChild(createHeaderRow(h.k, h.v));
                });
            } else {
                headersListEl.appendChild(createHeaderRow('Content-Type', 'application/json'));
            }
        }

        window.addHeaderRow = function() {
            headersListEl.appendChild(createHeaderRow());
            saveAPIState();
        }

        window.sendAPIRequest = async function() {
            const url = urlEl.value;
            const method = methodEl.value;
            const body = bodyEl.value;
            const resArea = document.getElementById('api-response');
            const resBadge = document.getElementById('res-code-badge');
            
            resArea.value = "// Sending secure request to " + url + "...\n// Method: " + method;
            resBadge.className = 'badge rounded-pill ms-2 d-none';

            const headers = {};
            document.querySelectorAll('.header-row').forEach(row => {
                const k = row.querySelectorAll('input')[0].value;
                const v = row.querySelectorAll('input')[1].value;
                if(k) headers[k] = v;
            });

            try {
                const start = performance.now();
                const options = {
                    method,
                    headers
                };
                if (method !== 'GET' && method !== 'HEAD' && body) {
                    options.body = body;
                }

                const response = await fetch(url, options);
                const end = performance.now();
                const duration = Math.round(end - start);

                const text = await response.text();
                try {
                    const contentType = response.headers.get('content-type') || '';
                    if (contentType.includes('application/json')) {
                        const data = JSON.parse(text);
                        resArea.value = JSON.stringify(data, null, 4);
                    } else {
                        resArea.value = text;
                    }
                } catch (e) {
                    resArea.value = text;
                }
                
                resBadge.textContent = `${response.status} - ${duration}ms`;
                resBadge.className = `badge rounded-pill ms-2 d-inline-block ${response.ok ? 'bg-success text-white' : 'bg-danger text-white'}`;
                
                addToHistory(method, url, response.status);
                logActivity('API Engine', `${method} request to ${url}`);
            } catch (err) {
                resArea.value = "// ERROR: " + err.message;
                resBadge.textContent = "FAILED";
                resBadge.className = 'badge rounded-pill ms-2 d-inline-block bg-danger text-white';
            }
        }

        function addToHistory(method, url, status) {
            history.unshift({ method, url, status, time: new Date().toLocaleTimeString() });
            history = history.slice(0, 10);
            localStorage.setItem('hub-api-history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('api-history-list');
            list.innerHTML = '';
            history.forEach(h => {
                const item = document.createElement('div');
                item.className = 'list-group-item p-3';
                item.onclick = () => loadFromHistory(h.url, h.method);

                const top = document.createElement('div');
                top.className = 'd-flex justify-content-between align-items-center mb-1';
                
                const badge = document.createElement('span');
                badge.className = `badge ${h.status < 400 ? 'bg-success' : 'bg-danger'} bg-opacity-10 ${h.status < 400 ? 'text-success' : 'text-danger'} fw-800`;
                badge.textContent = h.method;

                const time = document.createElement('span');
                time.className = 'small opacity-50 font-monospace';
                time.textContent = h.time;

                top.appendChild(badge);
                top.appendChild(time);

                const urlDiv = document.createElement('div');
                urlDiv.className = 'small text-truncate opacity-75';
                urlDiv.textContent = h.url;

                item.appendChild(top);
                item.appendChild(urlDiv);
                list.appendChild(item);
            });
        }

        window.loadFromHistory = function(url, method) {
            urlEl.value = url;
            methodEl.value = method;
            saveAPIState();
        }

        window.copyAPIRes = async () => {
            try {
                await navigator.clipboard.writeText(document.getElementById('api-response').value);
                alert('Response copied to clipboard!');
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
        }

        window.clearAPIRes = () => {
            document.getElementById('api-response').value = "";
            document.getElementById('res-code-badge').className = 'badge rounded-pill ms-2 d-none';
        }

        loadAPIState();
        renderHistory();
    })();
</script>
