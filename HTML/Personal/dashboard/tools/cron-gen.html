<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">Cron Generator</h1>
            <p class="text-muted mb-0">Visual tool to build schedule strings for automation tasks.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <button class="btn btn-accent px-5 py-2 fw-bold" onclick="copyCron()">
                <i class="bi bi-clipboard me-1"></i> Copy Cron
            </button>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card border-0 rounded-4 shadow-sm" style="background: var(--bg-secondary);">
                <div class="card-header bg-transparent border-white border-opacity-5 p-4">
                    <h6 class="small fw-800 text-uppercase mb-0 opacity-50" style="letter-spacing: 0.1em;">Schedule Builder</h6>
                </div>
                <div class="card-body p-4">
                    <div class="mb-4">
                        <label class="small text-muted fw-bold mb-2">Minutes</label>
                        <select id="cron-min" class="form-select bg-dark bg-opacity-25 border-0 text-white" onchange="buildCron()">
                            <option value="*">Every minute</option>
                            <option value="*/5">Every 5 minutes</option>
                            <option value="*/15">Every 15 minutes</option>
                            <option value="0">At the start of the minute</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="small text-muted fw-bold mb-2">Hours</label>
                        <select id="cron-hour" class="form-select bg-dark bg-opacity-25 border-0 text-white" onchange="buildCron()">
                            <option value="*">Every hour</option>
                            <option value="0">Midnight</option>
                            <option value="12">Noon</option>
                            <option value="*/2">Every 2 hours</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="small text-muted fw-bold mb-2">Day of Month</label>
                        <select id="cron-day" class="form-select bg-dark bg-opacity-25 border-0 text-white" onchange="buildCron()">
                            <option value="*">Every day</option>
                            <option value="1">1st of month</option>
                            <option value="15">15th of month</option>
                        </select>
                    </div>
                    <div class="mb-0">
                        <label class="small text-muted fw-bold mb-2">Month</label>
                        <select id="cron-month" class="form-select bg-dark bg-opacity-25 border-0 text-white" onchange="buildCron()">
                            <option value="*">Every month</option>
                            <option value="1">January</option>
                            <option value="6">June</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card border-0 rounded-4 shadow-sm h-100" style="background: var(--bg-secondary);">
                <div class="card-body p-5 d-flex flex-column align-items-center justify-content-center text-center">
                    <h1 class="display-3 fw-800 text-accent mb-3" id="cron-result" style="color: var(--accent);">* * * * *</h1>
                    <p class="text-muted fw-medium mb-0" id="cron-desc">Every minute, every hour, every day, every month.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const minEl = document.getElementById('cron-min');
        const hourEl = document.getElementById('cron-hour');
        const dayEl = document.getElementById('cron-day');
        const monthEl = document.getElementById('cron-month');
        const result = document.getElementById('cron-result');
        const desc = document.getElementById('cron-desc');

        // Load saved state
        minEl.value = localStorage.getItem('hub-cron-min') || '*';
        hourEl.value = localStorage.getItem('hub-cron-hour') || '*';
        dayEl.value = localStorage.getItem('hub-cron-day') || '*';
        monthEl.value = localStorage.getItem('hub-cron-month') || '*';

        window.buildCron = function(isSilent = false) {
            const min = minEl.value;
            const hour = hourEl.value;
            const day = dayEl.value;
            const month = monthEl.value;

            localStorage.setItem('hub-cron-min', min);
            localStorage.setItem('hub-cron-hour', hour);
            localStorage.setItem('hub-cron-day', day);
            localStorage.setItem('hub-cron-month', month);

            const str = `${min} ${hour} ${day} ${month} *`;
            result.textContent = str;
            
            let dText = `Every ${min === '*' ? 'minute' : (min.includes('/') ? min.split('/')[1] + ' minutes' : 'minute ' + min)}`;
            dText += `, every ${hour === '*' ? 'hour' : (hour.includes('/') ? '2 hours' : 'hour ' + hour)}`;
            desc.textContent = dText + ".";
            
            if (!isSilent) {
                logActivity('Development', `Generated: ${str}`);
            }
        }

        window.copyCron = function() {
            const text = result.textContent;
            navigator.clipboard.writeText(text);
            alert('Copied: ' + text);
        }

        buildCron(true);
    })();
</script>
