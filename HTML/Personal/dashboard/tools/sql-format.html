<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">SQL Formatter</h1>
            <p class="text-muted mb-0">Prettify and clean your messy SQL queries for better readability.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <button class="btn btn-accent px-4 py-2 fw-bold" onclick="formatSQL()">
                <i class="bi bi-magic me-1"></i> Format SQL
            </button>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-12">
            <div class="card border-0 rounded-4 shadow-sm" style="background: var(--bg-secondary);">
                <div class="card-header bg-transparent border-white border-opacity-5 p-3">
                    <span class="small fw-800 text-uppercase opacity-50 px-2">SQL Input / Output</span>
                </div>
                <div class="card-body p-0">
                    <textarea id="sql-input" class="form-control bg-transparent border-0 p-4 font-monospace" 
                              style="height: 500px; color: var(--text-main); font-size: 0.9rem; resize: none;" 
                              placeholder="SELECT * FROM table WHERE ..."></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Load SQL Formatter Library -->
<script src="https://cdn.jsdelivr.net/npm/sql-formatter@12.2.4/dist/sql-formatter.min.js"></script>

<script>
    (function() {
        const inputEl = document.getElementById('sql-input');

        // Load saved state
        inputEl.value = localStorage.getItem('hub-sql-input') || '';

        window.formatSQL = function() {
            try {
                const formatted = sqlFormatter.format(inputEl.value);
                inputEl.value = formatted;
                localStorage.setItem('hub-sql-input', formatted);
                logActivity('SQL Formatter', 'Formatted SQL query');
            } catch (e) {
                alert("Error: Unable to format SQL. Please check your syntax.");
            }
        }

        inputEl.addEventListener('input', () => {
            localStorage.setItem('hub-sql-input', inputEl.value);
        });
    })();
</script>
