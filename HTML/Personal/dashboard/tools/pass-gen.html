<div class="animate-fade-in">
    <div class="row mb-5 align-items-center">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">Vault Keygen <span class="badge bg-accent text-black small">PRO</span></h1>
            <p class="text-muted mb-0">Cryptographically secure password generation with entropy analysis.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <button class="btn btn-accent px-5 py-2 fw-bold shadow-accent" onclick="generateSecureKey()">
                <i class="bi bi-shield-lock-fill me-2"></i> GENERATE KEY
            </button>
        </div>
    </div>

    <div class="row g-4">
        <!-- Control Panel -->
        <div class="col-lg-4">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 mb-4">
                <h6 class="small fw-900 text-uppercase mb-4 opacity-50 tracking-wider">Parameters</h6>
                
                <div class="mb-4">
                    <div class="d-flex justify-content-between mb-2">
                        <label class="small text-muted fw-800">LENGTH</label>
                        <span id="len-val" class="text-accent fw-900">24</span>
                    </div>
                    <input type="range" id="pass-len" class="form-range custom-range" min="8" max="128" value="24" 
                           oninput="document.getElementById('len-val').textContent = this.value; generateSecureKey()">
                </div>

                <div class="vstack gap-3">
                    <div class="form-check form-switch d-flex justify-content-between align-items-center p-0">
                        <label class="small fw-800 text-muted">UPPERCASE [A-Z]</label>
                        <input class="form-check-input ms-0" type="checkbox" id="pass-upper" checked onchange="generateSecureKey()">
                    </div>
                    <div class="form-check form-switch d-flex justify-content-between align-items-center p-0">
                        <label class="small fw-800 text-muted">NUMBERS [0-9]</label>
                        <input class="form-check-input ms-0" type="checkbox" id="pass-num" checked onchange="generateSecureKey()">
                    </div>
                    <div class="form-check form-switch d-flex justify-content-between align-items-center p-0">
                        <label class="small fw-800 text-muted">SYMBOLS [!@#$]</label>
                        <input class="form-check-input ms-0" type="checkbox" id="pass-sym" checked onchange="generateSecureKey()">
                    </div>
                    <div class="form-check form-switch d-flex justify-content-between align-items-center p-0">
                        <label class="small fw-800 text-muted">AVOID SIMILAR [l, 1, O, 0]</label>
                        <input class="form-check-input ms-0" type="checkbox" id="pass-similar" onchange="generateSecureKey()">
                    </div>
                </div>
            </div>

            <!-- Strength Meter -->
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 text-center">
                <span class="small fw-800 text-muted mb-3 d-block text-uppercase">Security Entropy</span>
                <div class="progress bg-dark bg-opacity-50 rounded-pill mb-2" style="height: 8px;">
                    <div id="strength-bar" class="progress-bar rounded-pill" style="width: 0%; transition: all 0.5s ease;"></div>
                </div>
                <div class="d-flex justify-content-between small fw-900">
                    <span id="strength-text" class="text-muted">--</span>
                    <span id="entropy-bits" class="text-white-50">0 bits</span>
                </div>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="col-lg-8">
            <div class="card border-0 rounded-4 h-100 d-flex flex-column align-items-center justify-content-center p-5 text-center position-relative overflow-hidden" 
                 style="background: var(--bg-secondary);">
                
                <div class="position-relative w-100 mb-4 animate-fade-in">
                    <div class="p-4 bg-dark bg-opacity-25 rounded-4 border border-white border-opacity-5 w-100">
                        <h2 class="fw-900 text-accent mb-0 font-monospace text-break user-select-all" id="pass-result" style="letter-spacing: 2px;">••••••••••••</h2>
                    </div>
                </div>

                <div class="d-flex gap-3">
                    <button class="btn btn-dark border border-white border-opacity-10 px-5 py-3 rounded-4 fw-900 shadow-sm" onclick="copyKeyToClipboard()">
                        <i class="bi bi-clipboard-pulse me-2"></i> COPY TO CLIPBOARD
                    </button>
                    <button class="btn btn-outline-secondary px-4 py-3 rounded-4" onclick="generateSecureKey()">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                </div>

                <div class="mt-5 w-100">
                    <h6 class="small fw-900 text-muted text-uppercase mb-3 opacity-25">History Batch</h6>
                    <div id="keygen-history" class="list-group list-group-flush bg-transparent">
                        <!-- History injected -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .shadow-accent { box-shadow: 0 10px 30px rgba(250, 204, 21, 0.2); }
    .custom-range::-webkit-slider-thumb { background: var(--accent); }
    .progress-bar.bg-danger { background: #ef4444 !important; }
    .progress-bar.bg-warning { background: #facc15 !important; }
    .progress-bar.bg-success { background: #22c55e !important; }
    #pass-result { min-height: 2.5rem; }
</style>

<script>
    (function() {
        // History is deliberately NOT stored in localStorage for security
        let history = [];

        const lenEl = document.getElementById('pass-len');
        const upperEl = document.getElementById('pass-upper');
        const numEl = document.getElementById('pass-num');
        const symEl = document.getElementById('pass-sym');
        const similarEl = document.getElementById('pass-similar');

        // Load saved settings
        lenEl.value = localStorage.getItem('hub-pass-len') || '24';
        document.getElementById('len-val').textContent = lenEl.value;
        upperEl.checked = localStorage.getItem('hub-pass-upper') !== 'false';
        numEl.checked = localStorage.getItem('hub-pass-num') !== 'false';
        symEl.checked = localStorage.getItem('hub-pass-sym') !== 'false';
        similarEl.checked = localStorage.getItem('hub-pass-similar') === 'true';

        window.generateSecureKey = (isSilent = false) => {
            const len = parseInt(lenEl.value);
            const upper = upperEl.checked;
            const num = numEl.checked;
            const sym = symEl.checked;
            const noSimilar = similarEl.checked;

            localStorage.setItem('hub-pass-len', len);
            localStorage.setItem('hub-pass-upper', upper);
            localStorage.setItem('hub-pass-num', num);
            localStorage.setItem('hub-pass-sym', sym);
            localStorage.setItem('hub-pass-similar', noSimilar);

            let charset = "abcdefghijklmnopqrstuvwxyz";
            if (upper) charset += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if (num) charset += "0123456789";
            if (sym) charset += "!@#$%^&*()_+~`|}{[]:;?><,./-=";
            if (noSimilar) charset = charset.replace(/[il1Lo0O]/g, '');

            // Optimized rejection sampling to ensure uniform distribution
            let pass = "";
            const maxByte = 256 - (256 % charset.length);
            while (pass.length < len) {
                const batch = new Uint8Array(Math.ceil((len - pass.length) * 1.5));
                crypto.getRandomValues(batch);
                for (const byte of batch) {
                    if (pass.length >= len) break;
                    if (byte < maxByte) {
                        pass += charset[byte % charset.length];
                    }
                }
            }

            document.getElementById('pass-result').textContent = pass;
            updateStrength(pass, charset.length);
            
            addToHistory(pass);
            
            if (!isSilent) {
                logActivity('Security', 'Generated secure cryptokey');
            }
        }

        function updateStrength(pass, charsetLen) {
            const entropy = Math.round(pass.length * Math.log2(charsetLen));
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            const bits = document.getElementById('entropy-bits');

            bits.textContent = `${entropy} bits`;
            
            let percent = Math.min((entropy / 128) * 100, 100);
            bar.style.width = percent + '%';
            
            if (entropy < 60) {
                bar.className = 'progress-bar bg-danger';
                text.textContent = 'WEAK';
                text.className = 'text-danger';
            } else if (entropy < 100) {
                bar.className = 'progress-bar bg-warning';
                text.textContent = 'STRONG';
                text.className = 'text-warning';
            } else {
                bar.className = 'progress-bar bg-success';
                text.textContent = 'UNBREAKABLE';
                text.className = 'text-success';
            }
        }

        function addToHistory(pass) {
            if (history[0] === pass) return;
            history.unshift(pass);
            history = history.slice(0, 5);
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('keygen-history');
            list.innerHTML = '';
            history.forEach(p => {
                const div = document.createElement('div');
                div.className = 'list-group-item bg-transparent border-white border-opacity-5 p-2 small opacity-50 font-monospace text-truncate';
                div.textContent = p; 
                list.appendChild(div);
            });
        }

        window.copyKeyToClipboard = async () => {
            const txt = document.getElementById('pass-result').textContent;
            try {
                await navigator.clipboard.writeText(txt);
                alert('Copied to clipboard!');
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
        }

        renderHistory();
        generateSecureKey(true);
    })();
</script>
