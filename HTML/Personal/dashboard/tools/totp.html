<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">TOTP Simulator</h1>
            <p class="text-muted mb-0">Test 2FA / Authenticator code generation logic (client-side demo).</p>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4">
                <h6 class="small fw-800 text-uppercase mb-4 opacity-50">Secret Key</h6>
                <input type="text" id="totp-secret" class="form-control bg-dark bg-opacity-25 border-0 text-white p-3 font-monospace mb-4" value="JBSWY3DPEHPK3PXP">
                <p class="small text-muted mb-0">This tool simulates how Google Authenticator works by rotating a code every 30 seconds.</p>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-5 text-center">
                <h6 class="small fw-800 text-uppercase opacity-50 mb-3">Current Code</h6>
                <h1 class="display-2 fw-800 text-accent mb-3" id="totp-code" style="letter-spacing: 0.1em;">...</h1>
                <div class="progress bg-dark bg-opacity-25" style="height: 6px;">
                    <div id="totp-progress" class="progress-bar bg-accent" style="width: 50%"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function updateTOTP() {
        const now = Math.floor(Date.now() / 1000);
        const remaining = 30 - (now % 30);
        const progress = (remaining / 30) * 100;
        
        document.getElementById('totp-progress').style.width = progress + "%";
        
        // Simulating a code based on the secret
        const secret = document.getElementById('totp-secret').value;
        const cycle = Math.floor(now / 30);
        const code = (Math.abs(hashString(secret + cycle)) % 1000000).toString().padStart(6, '0');
        
        document.getElementById('totp-code').textContent = code.slice(0,3) + " " + code.slice(3);
    }

    function hashString(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = ((hash << 5) - hash) + str.charCodeAt(i);
            hash |= 0;
        }
        return hash;
    }

    setInterval(updateTOTP, 1000);
    updateTOTP();
</script>
