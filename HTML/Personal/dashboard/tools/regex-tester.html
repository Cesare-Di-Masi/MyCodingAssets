<div class="animate-fade-in">
    <div class="row mb-5 align-items-center">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">RegEx Engine <span class="badge bg-accent text-black small">PRO</span></h1>
            <p class="text-muted mb-0">High-performance regex testing with live visualization and capture groups.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <div class="input-group shadow-sm">
                <span class="input-group-text bg-dark border-0 text-white fw-900 fs-5">/</span>
                <input type="text" id="regex-pattern" class="form-control bg-secondary bg-opacity-10 border-0 text-white py-3 fw-bold" 
                       placeholder="[a-zA-Z]+" oninput="executeRegexAnalysis()">
                <span class="input-group-text bg-dark border-0 text-white fw-900 fs-5">/</span>
                <input type="text" id="regex-flags" class="form-control bg-secondary bg-opacity-10 border-0 text-white py-3" 
                       placeholder="flags" style="max-width: 90px;" oninput="executeRegexAnalysis()">
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Input area with Highlight Overlay -->
        <div class="col-lg-7">
            <div class="card border-0 rounded-4 shadow-sm h-100 overflow-hidden" style="background: var(--bg-secondary);">
                <div class="card-header bg-transparent border-white border-opacity-5 p-3 d-flex justify-content-between">
                    <span class="small fw-800 text-uppercase opacity-50 px-2">Test String</span>
                    <button class="btn btn-sm text-muted p-0" onclick="clearRegexInput()"><i class="bi bi-trash"></i> Clear</button>
                </div>
                <div class="card-body p-0 position-relative" style="height: 500px;">
                    <div id="regex-backdrop" class="p-4 font-monospace position-absolute top-0 left-0 w-100 h-100" 
                         style="color: transparent; white-space: pre-wrap; overflow-y: auto; pointer-events: none; z-index: 1;"></div>
                    <textarea id="regex-input" class="form-control bg-transparent border-0 p-4 font-monospace position-absolute top-0 left-0 w-100 h-100" 
                              style="color: var(--text-main); font-size: 0.95rem; resize: none; z-index: 2; background: transparent !important;" 
                              placeholder="Type text here to test matches..." oninput="executeRegexAnalysis()"></textarea>
                </div>
            </div>
        </div>

        <!-- Matches & Inspector -->
        <div class="col-lg-5">
            <!-- Summary Stats -->
            <div class="row g-3 mb-4">
                <div class="col-6">
                    <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-3 text-center">
                        <span class="small fw-800 text-muted mb-1" style="font-size: 0.6rem;">MATCHES</span>
                        <h5 id="count-matches" class="mb-0 fw-800 text-accent">0</h5>
                    </div>
                </div>
                <div class="col-6">
                    <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-3 text-center">
                        <span class="small fw-800 text-muted mb-1" style="font-size: 0.6rem;">COMPLEXITY</span>
                        <h5 id="complexity-label" class="mb-0 fw-800 text-muted">LOW</h5>
                    </div>
                </div>
            </div>

            <div class="card border-0 rounded-4 shadow-sm h-100 overflow-hidden" style="background: var(--bg-secondary);">
                <div class="card-header bg-transparent border-white border-opacity-5 p-3">
                    <span class="small fw-800 text-uppercase opacity-50 px-2">Capture Group Inspector</span>
                </div>
                <div class="card-body p-4 overflow-auto" id="regex-results" style="max-height: 500px;">
                    <div class="text-muted small">No matches to inspect.</div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    #regex-backdrop mark {
        background: rgba(250, 204, 21, 0.4);
        color: transparent;
        border-bottom: 2px solid var(--accent);
        padding: 2px 0;
    }
    .group-item {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
    }
    .group-pill {
        font-size: 0.6rem;
        font-weight: 800;
        padding: 2px 8px;
        border-radius: 10px;
        background: rgba(255,255,255,0.05);
        color: var(--text-muted);
    }
    .shadow-accent { box-shadow: 0 8px 25px rgba(250, 204, 21, 0.2); }
</style>

<script>
    (function() {
        const patternEl = document.getElementById('regex-pattern');
        const flagsEl = document.getElementById('regex-flags');
        const inputEl = document.getElementById('regex-input');
        const backdropEl = document.getElementById('regex-backdrop');
        const resultsEl = document.getElementById('regex-results');
        const matchCountEl = document.getElementById('count-matches');

        // Load saved state
        patternEl.value = localStorage.getItem('hub-regex-pattern') || '([a-z]+)-(\\d+)';
        flagsEl.value = localStorage.getItem('hub-regex-flags') || 'gi';
        inputEl.value = localStorage.getItem('hub-regex-input') || 'user-123, test-456, app-789';

        window.executeRegexAnalysis = (isSilent = false) => {
            const pattern = patternEl.value;
            const flags = flagsEl.value;
            const text = inputEl.value;

            // Save state
            localStorage.setItem('hub-regex-pattern', pattern);
            localStorage.setItem('hub-regex-flags', flags);
            localStorage.setItem('hub-regex-input', text);

            // Sync scrolling
            backdropEl.scrollTop = inputEl.scrollTop;

            if(!pattern || !text) {
                backdropEl.textContent = text;
                resultsEl.innerHTML = '<div class="text-muted small">No matches to inspect.</div>';
                matchCountEl.textContent = '0';
                return;
            }

            try {
                const re = new RegExp(pattern, flags.includes('g') ? flags : flags + 'g');
                const matches = [...text.matchAll(re)];
                
                // 1. Update Highlights (Securely)
                const escapedText = text.replace(/[&<>"']/g, m => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                }[m]));
                
                let highlighted = escapedText.replace(new RegExp(pattern, flags.includes('g') ? flags : flags + 'g'), '<mark>$&</mark>');
                backdropEl.innerHTML = highlighted;

                // 2. Update Stats
                matchCountEl.textContent = matches.length;
                document.getElementById('complexity-label').textContent = pattern.length > 20 ? 'HIGH' : (pattern.length > 10 ? 'MED' : 'LOW');

                // 3. Update Group Inspector (Securely)
                resultsEl.innerHTML = '';
                if(matches.length === 0) {
                    resultsEl.innerHTML = '<div class="text-warning small fw-800">NO MATCHES FOUND</div>';
                    return;
                }

                matches.forEach((m, i) => {
                    const item = document.createElement('div');
                    item.className = 'group-item animate-fade-in';
                    
                    const header = document.createElement('div');
                    header.className = 'd-flex justify-content-between align-items-center mb-2';
                    header.innerHTML = `<span class="badge bg-accent text-black px-2">#${i + 1}</span><span class="small opacity-50 font-monospace" style="font-size: 0.7rem;">Pos: ${m.index}</span>`;
                    
                    const matchText = document.createElement('div');
                    matchText.className = 'fw-800 text-white mb-2';
                    matchText.style.fontSize = '0.9rem';
                    matchText.textContent = m[0];
                    
                    item.appendChild(header);
                    item.appendChild(matchText);
                    
                    m.slice(1).forEach((group, gi) => {
                        const gDiv = document.createElement('div');
                        gDiv.className = 'd-flex align-items-center gap-2 mb-1';
                        gDiv.innerHTML = `<span class="group-pill">Group ${gi + 1}</span>`;
                        const gVal = document.createElement('span');
                        gVal.className = 'small font-monospace text-accent text-truncate';
                        gVal.textContent = group || 'null';
                        gDiv.appendChild(gVal);
                        item.appendChild(gDiv);
                    });
                    
                    resultsEl.appendChild(item);
                });

                if (!isSilent) {
                    logActivity('Development', `Analyzed RegEx: /${pattern}/`);
                }
            } catch (e) {
                backdropEl.textContent = text;
                resultsEl.innerHTML = `<div class="text-danger small fw-800"><i class="bi bi-exclamation-octagon-fill me-2"></i>INVALID PATTERN</div><div class="text-muted small mt-2"></div>`;
                resultsEl.querySelector('.text-muted').textContent = e.message;
                matchCountEl.textContent = '!';
            }
        }

        window.clearRegexInput = () => {
            inputEl.value = "";
            executeRegexAnalysis(false); // Log this action
        }

        // Handle scroll sync
        inputEl.addEventListener('scroll', () => {
            backdropEl.scrollTop = inputEl.scrollTop;
        });

        executeRegexAnalysis(true); // Silent on load
    })();
</script>
