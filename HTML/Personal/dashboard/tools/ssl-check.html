<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">SSL Checker</h1>
            <p class="text-muted mb-0">Verify SSL certificate validity and expiration for any domain.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <div class="d-inline-flex bg-secondary bg-opacity-10 p-2 rounded-4 border border-white border-opacity-5">
                <input type="text" id="ssl-domain" class="form-control bg-transparent border-0 text-white" placeholder="google.com" style="width: 250px;">
                <button class="btn btn-accent rounded-3 px-3" onclick="checkSSL()">
                    <i class="bi bi-shield-check"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4">
                <div id="ssl-results" class="text-white">
                    <div class="text-muted small">Enter a domain to check its SSL status.</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const domainEl = document.getElementById('ssl-domain');
        const results = document.getElementById('ssl-results');

        // Load saved state
        domainEl.value = localStorage.getItem('hub-ssl-domain') || '';

        window.checkSSL = async function(isSilent = false) {
            const domain = domainEl.value.trim();
            if(!domain) return;
            
            localStorage.setItem('hub-ssl-domain', domain);

            results.innerHTML = `<div class="spinner-border spinner-border-sm text-accent me-2"></div> Checking SSL for ${domain}...`;

            try {
                const response = await fetch(`https://api.certspotter.com/v1/issuances?domain=${domain}&include_subdomains=true&expand=dns_names`);
                const data = await response.json();
                
                results.innerHTML = '';
                if (data.length > 0) {
                    const latest = data[0];
                    const card = document.createElement('div');
                    card.className = 'p-4 bg-dark bg-opacity-25 rounded-4 border-start border-4 border-success';
                    
                    const title = document.createElement('h5');
                    title.className = 'fw-800 text-success mb-3';
                    title.innerHTML = '<i class="bi bi-patch-check-fill me-2"></i>SSL Certificate Found';
                    
                    const row = document.createElement('div');
                    row.className = 'row g-3';
                    
                    const col1 = document.createElement('div');
                    col1.className = 'col-md-6';
                    col1.innerHTML = '<label class="small text-muted fw-bold d-block">Public Key (SHA256)</label>';
                    const val1 = document.createElement('div');
                    val1.className = 'fw-bold small text-truncate';
                    val1.textContent = latest.pubkey_sha256;
                    col1.appendChild(val1);

                    const col2 = document.createElement('div');
                    col2.className = 'col-md-6';
                    col2.innerHTML = '<label class="small text-muted fw-bold d-block">Issued On</label>';
                    const val2 = document.createElement('div');
                    val2.className = 'fw-bold';
                    val2.textContent = new Date(latest.not_before).toLocaleDateString();
                    col2.appendChild(val2);

                    row.appendChild(col1);
                    row.appendChild(col2);
                    
                    const hr = document.createElement('hr');
                    hr.className = 'border-white border-opacity-10';
                    
                    const footer = document.createElement('p');
                    footer.className = 'small text-muted mb-0';
                    footer.innerHTML = 'Log ID: <code id="log-id"></code>';
                    
                    card.appendChild(title);
                    card.appendChild(row);
                    card.appendChild(hr);
                    card.appendChild(footer);
                    results.appendChild(card);
                    document.getElementById('log-id').textContent = latest.id;

                    if (!isSilent) {
                        logActivity('Security', `SSL Check: ${domain}`);
                    }
                } else {
                    const warn = document.createElement('div');
                    warn.className = 'text-warning';
                    warn.textContent = `No public SSL data found for ${domain}.`;
                    results.appendChild(warn);
                }
            } catch (e) {
                const err = document.createElement('div');
                err.className = 'text-danger';
                err.textContent = 'Failed to connect to monitoring service.';
                results.appendChild(err);
            }
        }
    })();
</script>
