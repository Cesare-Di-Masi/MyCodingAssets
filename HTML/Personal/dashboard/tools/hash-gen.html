<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">Hash Tool</h1>
            <p class="text-muted mb-0">Generate SHA-256, SHA-384, or SHA-512 hashes from text strings.</p>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-12">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 mb-4">
                <label class="small text-muted fw-bold mb-3 text-uppercase">Input String</label>
                <textarea id="hash-input" class="form-control bg-dark bg-opacity-25 border-0 text-white p-3 font-monospace mb-4" 
                          style="height: 120px; resize: none;" oninput="generateHashes()"></textarea>
                
                <div class="row g-4">
                    <div class="col-md-4">
                        <label class="small text-muted fw-bold mb-2">SHA-256</label>
                        <input type="text" id="sha256-out" class="form-control bg-dark bg-opacity-50 border-0 text-accent small font-monospace" readonly>
                    </div>
                    <div class="col-md-4">
                        <label class="small text-muted fw-bold mb-2">SHA-384</label>
                        <input type="text" id="sha384-out" class="form-control bg-dark bg-opacity-50 border-0 text-accent small font-monospace" readonly>
                    </div>
                    <div class="col-md-4">
                        <label class="small text-muted fw-bold mb-2">SHA-512</label>
                        <input type="text" id="sha512-out" class="form-control bg-dark bg-opacity-50 border-0 text-accent small font-monospace" readonly>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const inputEl = document.getElementById('hash-input');

        // Load saved state
        inputEl.value = localStorage.getItem('hub-hash-input') || '';

        window.generateHashes = async function(isSilent = false) {
            const text = inputEl.value;
            localStorage.setItem('hub-hash-input', text);

            if(!text) {
                document.getElementById('sha256-out').value = '';
                document.getElementById('sha384-out').value = '';
                document.getElementById('sha512-out').value = '';
                return;
            }

            const algos = ['SHA-256', 'SHA-384', 'SHA-512'];
            const msgBuffer = new TextEncoder().encode(text);

            for (let algo of algos) {
                const hashBuffer = await crypto.subtle.digest(algo, msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                document.getElementById(`${algo.toLowerCase().replace('-', '')}-out`).value = hashHex;
            }
            
            if (!isSilent) {
                logActivity('Security', 'Generated hashes');
            }
        }

        generateHashes(true);
    })();
</script>
