<div class="animate-fade-in">
    <h3 class="fw-bold"><i class="bi bi-pencil-square me-2 text-primary"></i>Note Rapide</h3>
    <p class="text-muted">I tuoi appunti salvati localmente.</p>

    <div class="card bg-dark border-secondary rounded-4 p-4">
        <textarea id="tool-note-area" class="form-control bg-transparent border-0 text-white shadow-none" 
                  placeholder="Scrivi qui..." style="height: 300px; resize: none;"></textarea>
    </div>
</div>

<script>
    // Logica interna del tool
    const area = document.getElementById('tool-note-area');
    
    // Carica dati
    area.value = localStorage.getItem('hub-quick-note') || '';

    // Salva e Logga l'attività nell'Hub
    area.addEventListener('input', () => {
        localStorage.setItem('hub-quick-note', area.value);
        
        // Questa funzione parla con l'Hub centrale!
        logActivity('Note Rapide', 'Nota aggiornata');
    });
</script>
