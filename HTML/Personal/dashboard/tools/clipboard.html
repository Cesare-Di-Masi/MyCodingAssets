<div class="animate-fade-in">
    <div class="row mb-5">
        <div class="col-7">
            <h1 class="fw-800 mb-1">Snippet History</h1>
            <p class="text-muted mb-0">Save and copy frequently used text or code snippets.</p>
        </div>
        <div class="col-5 text-end">
            <button class="btn btn-accent px-4 py-2 fw-bold" onclick="addNewSnippet()">
                <i class="bi bi-plus-lg me-1"></i> New Snippet
            </button>
        </div>
    </div>

    <div id="snippet-list" class="row g-4">
        <!-- Snippets go here -->
    </div>
</div>

<script>
    (function() {
        let snippets = JSON.parse(localStorage.getItem('hub-snippets') || '[{"title": "Git Commit", "content": "git add . && git commit -m \u0022update\u0022"}, {"title": "Lorem Ipsum", "content": "Lorem ipsum dolor sit amet..."}]');

        window.renderSnippets = function() {
            const list = document.getElementById('snippet-list');
            if(snippets.length === 0) {
                list.innerHTML = `<div class="col-12 text-center py-5 text-muted">No snippets saved yet.</div>`;
                return;
            }
            list.innerHTML = '';
            snippets.forEach((s, i) => {
                const col = document.createElement('div');
                col.className = 'col-md-6';
                
                const card = document.createElement('div');
                card.className = 'card bg-secondary bg-opacity-10 border-0 rounded-4 p-4';
                
                const top = document.createElement('div');
                top.className = 'd-flex justify-content-between align-items-center mb-3';
                
                const title = document.createElement('h6');
                title.className = 'fw-800 mb-0';
                title.textContent = s.title;
                
                const actions = document.createElement('div');
                const copyBtn = document.createElement('button');
                copyBtn.className = 'btn btn-sm btn-outline-accent me-1';
                copyBtn.innerHTML = '<i class="bi bi-clipboard"></i>';
                copyBtn.onclick = () => copySnippet(i);
                
                const delBtn = document.createElement('button');
                delBtn.className = 'btn btn-sm text-danger border-0 p-0';
                delBtn.innerHTML = '<i class="bi bi-trash"></i>';
                delBtn.onclick = () => deleteSnippet(i);
                
                actions.appendChild(copyBtn);
                actions.appendChild(delBtn);
                top.appendChild(title);
                top.appendChild(actions);
                
                const content = document.createElement('div');
                content.className = 'bg-dark bg-opacity-50 p-3 rounded-4 font-monospace small text-white-50 overflow-auto';
                content.style.maxHeight = '100px';
                content.textContent = s.content;
                
                card.appendChild(top);
                card.appendChild(content);
                col.appendChild(card);
                list.appendChild(col);
            });
            localStorage.setItem('hub-snippets', JSON.stringify(snippets));
        }

        window.addNewSnippet = function() {
            const title = prompt("Snippet title:");
            const content = prompt("Snippet content:");
            if(title && content) {
                snippets.push({ title, content });
                renderSnippets();
                logActivity('Productivity', 'Added snippet: ' + title);
            }
        }

        window.deleteSnippet = function(i) {
            snippets.splice(i, 1);
            renderSnippets();
        }

        window.copySnippet = function(i) {
            navigator.clipboard.writeText(snippets[i].content);
            logActivity('Productivity', 'Copied snippet: ' + snippets[i].title);
        }

        renderSnippets();
    })();
</script>
