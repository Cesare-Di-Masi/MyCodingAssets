<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">Code Minifier</h1>
            <p class="text-muted mb-0">Compress and minify HTML, CSS, and JS for production use.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <div class="btn-group">
                <button class="btn btn-accent px-4 py-2 fw-bold" onclick="minifyCode('html')">HTML</button>
                <button class="btn btn-dark border border-white border-opacity-10 px-4 py-2 fw-bold text-white" onclick="minifyCode('css')">CSS</button>
                <button class="btn btn-dark border border-white border-opacity-10 px-4 py-2 fw-bold text-white" onclick="minifyCode('js')">JS</button>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-12">
            <div class="card border-0 rounded-4 shadow-sm mb-4" style="background: var(--bg-secondary);">
                <div class="card-header bg-transparent border-white border-opacity-5 p-3 d-flex justify-content-between align-items-center">
                    <span class="small fw-800 text-uppercase opacity-50 px-2">Input / Output</span>
                    <button class="btn btn-link btn-sm text-decoration-none text-muted" onclick="copyMinified()">
                        <i class="bi bi-clipboard me-1"></i> Copy
                    </button>
                </div>
                <div class="card-body p-0">
                    <textarea id="minify-input" class="form-control bg-transparent border-0 p-4 font-monospace" 
                              style="height: 500px; color: var(--text-main); font-size: 0.9rem; resize: none;" 
                              placeholder="Paste code here..."></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const input = document.getElementById('minify-input');

        input.value = localStorage.getItem('hub-minify-input') || '';

        window.minifyCode = function(type) {
            let val = input.value;
            try {
                if (type === 'html') {
                    val = val.replace(/\s+/g, ' ').replace(/>\s+</g, '><').trim();
                } else if (type === 'css') {
                    val = val.replace(/\s+/g, ' ').replace(/\/\*.*?\*\//g, '').replace(/\s*([\{\}:;,])\s*/g, '$1').trim();
                } else if (type === 'js') {
                    val = val.replace(/\s+/g, ' ').replace(/\/\/.*?\n/g, '').replace(/\/\*.*?\*\//g, '').replace(/\s*([\{\};,=])\s*/g, '$1').trim();
                }
                input.value = val;
                localStorage.setItem('hub-minify-input', val);
                logActivity('Development', `Minified ${type.toUpperCase()}`);
            } catch (e) {
                alert("Error minifying code: " + e.message);
            }
        }

        window.copyMinified = function() {
            input.select();
            document.execCommand('copy');
            alert('Copied to clipboard!');
        }

        input.addEventListener('input', () => {
            localStorage.setItem('hub-minify-input', input.value);
        });
    })();
</script>
