<div class="animate-fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0"><i class="bi bi-terminal me-2 text-warning"></i>System Logs</h3>
            <p class="text-muted small">Monitoraggio attività dell'hub in tempo reale.</p>
        </div>
        <button class="btn btn-outline-danger btn-sm" onclick="clearLogs()">
            <i class="bi bi-trash me-1"></i> Svuota
        </button>
    </div>

    <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4 py-3">Timestamp</th>
                        <th class="py-3">Modulo</th>
                        <th class="py-3">Azione</th>
                    </tr>
                </thead>
                <tbody id="log-table-body">
                    <!-- I log vengono iniettati qui -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    (function() {
        window.renderLogs = function() {
            const body = document.getElementById('log-table-body');
            let logs = [];
            try {
                logs = JSON.parse(localStorage.getItem('hub-logs') || '[]');
            } catch (e) {
                logs = [];
            }
            
            if (logs.length === 0) {
                body.innerHTML = `<tr><td colspan="3" class="text-center py-5 text-muted small">Nessuna attività registrata.</td></tr>`;
                return;
            }

            body.innerHTML = '';
            logs.forEach(log => {
                const tr = document.createElement('tr');
                
                const tdTime = document.createElement('td');
                tdTime.className = 'ps-4 small text-muted';
                tdTime.textContent = log.timestamp;
                
                const tdMod = document.createElement('td');
                const badge = document.createElement('span');
                badge.className = 'badge bg-secondary-subtle text-secondary rounded-pill px-3';
                badge.textContent = log.module;
                tdMod.appendChild(badge);
                
                const tdAct = document.createElement('td');
                tdAct.className = 'fw-medium';
                tdAct.textContent = log.action;
                
                tr.appendChild(tdTime);
                tr.appendChild(tdMod);
                tr.appendChild(tdAct);
                body.appendChild(tr);
            });
        }

        window.clearLogs = function() {
            localStorage.removeItem('hub-logs');
            renderLogs();
            logActivity('System Logs', 'Registri attività svuotati');
        }

        renderLogs();
    })();
</script>
