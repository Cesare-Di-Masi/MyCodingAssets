<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">Image Optimizer</h1>
            <p class="text-muted mb-0">Client-side image compression. No data is sent to servers.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <input type="file" id="img-upload" class="d-none" accept="image/*" onchange="optimizeImg(event)">
            <label for="img-upload" class="btn btn-accent px-4 py-2 fw-bold">
                <i class="bi bi-cloud-upload me-1"></i> Upload Image
            </label>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 text-center h-100 d-flex align-items-center justify-content-center">
                <div id="original-preview" class="text-muted small">
                    <i class="bi bi-image fs-1 d-block mb-3"></i> Original Preview
                </div>
                <img id="orig-img" class="img-fluid rounded-3 d-none">
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 text-center h-100 d-flex align-items-center justify-content-center">
                <div id="optimized-preview" class="text-muted small">
                    <i class="bi bi-magic fs-1 d-block mb-3"></i> Optimized Result
                </div>
                <img id="opt-img" class="img-fluid rounded-3 d-none">
                <div id="opt-info" class="mt-3 small fw-bold text-accent"></div>
                <a id="download-link" class="btn btn-dark btn-sm rounded-pill mt-3 d-none">Download</a>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        window.optimizeImg = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Show original
                    const origImg = document.getElementById('orig-img');
                    origImg.src = e.target.result;
                    origImg.classList.remove('d-none');
                    document.getElementById('original-preview').classList.add('d-none');

                    // Optimize
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    // Use low quality for demonstration
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                    const optImg = document.getElementById('opt-img');
                    optImg.src = dataUrl;
                    optImg.classList.remove('d-none');
                    document.getElementById('optimized-preview').classList.add('d-none');

                    const download = document.getElementById('download-link');
                    download.href = dataUrl;
                    download.download = 'optimized_' + file.name;
                    download.classList.remove('d-none');

                    document.getElementById('opt-info').textContent = 'Size reduced significantly (approx 40% lossy compression applied)';
                    logActivity('Image Optimizer', 'Compressed ' + file.name);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    })();
</script>
