<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">Markdown Preview</h1>
            <p class="text-muted mb-0">Live Markdown editor with real-time HTML preview.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <button class="btn btn-accent px-4 py-2 fw-bold" onclick="copyMD()">
                <i class="bi bi-clipboard me-1"></i> Copy MD
            </button>
        </div>
    </div>

    <div class="row g-4 h-100">
        <!-- Editor Area -->
        <div class="col-lg-6">
            <div class="card border-0 rounded-4 shadow-sm" style="background: var(--bg-secondary);">
                <div class="card-header bg-transparent border-white border-opacity-5 p-3">
                    <span class="small fw-800 text-uppercase opacity-50 px-2">Editor (Markdown)</span>
                </div>
                <div class="card-body p-0">
                    <textarea id="md-input" class="form-control bg-transparent border-0 p-4 font-monospace" 
                              style="height: 600px; color: var(--text-main); font-size: 0.9rem; resize: none;" 
                              placeholder="# Welcome to Markdown..." oninput="renderMD()"></textarea>
                </div>
            </div>
        </div>

        <!-- Preview Area -->
        <div class="col-lg-6">
            <div class="card border-0 rounded-4 shadow-sm h-100" style="background: var(--bg-secondary);">
                <div class="card-header bg-transparent border-white border-opacity-5 p-3">
                    <span class="small fw-800 text-uppercase opacity-50 px-2">Preview (HTML)</span>
                </div>
                <div class="card-body p-4" id="md-preview" style="height: 600px; overflow-y: auto;">
                    <!-- Preview content injected here -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Load Marked.js -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
    (function() {
        const inputEl = document.getElementById('md-input');
        const preview = document.getElementById('md-preview');

        // Load saved state
        inputEl.value = localStorage.getItem('hub-md-input') || "# Welcome to Markdown\n\n- Real-time preview\n- GitHub flavored\n- Fast and light\n\n```javascript\nconsole.log('Hello from TechHub!');\n```";

        window.renderMD = function(isSilent = false) {
            const input = inputEl.value;
            localStorage.setItem('hub-md-input', input);
            try {
                preview.innerHTML = marked.parse(input);
                if (!isSilent) {
                    logActivity('Markdown Preview', 'Updated content');
                }
            } catch (e) {
                preview.innerHTML = "Error parsing markdown: " + e.message;
            }
        }

        window.copyMD = function() {
            inputEl.select();
            document.execCommand('copy');
            alert('Copied to clipboard!');
        }

        renderMD(true);
    })();
</script>
