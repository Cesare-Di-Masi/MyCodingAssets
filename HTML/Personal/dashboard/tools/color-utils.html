<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">Color Lab <span class="badge bg-accent text-black small">ULTRA</span></h1>
            <p class="text-muted mb-0">Professional color engineering with precise space conversions and export.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <div class="d-inline-flex bg-secondary bg-opacity-10 p-2 rounded-4 border border-white border-opacity-5">
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-transparent border-0 text-muted small fw-800">BASE HEX</span>
                    <input type="text" id="hex-input" class="form-control bg-transparent border-0 text-white fw-900" value="#facc15" style="width: 100px;">
                    <input type="color" id="color-picker" class="form-control bg-transparent border-0 p-0" value="#facc15" style="width: 44px; height: 32px; cursor: pointer;">
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Color Metrics -->
        <div class="col-lg-4">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 mb-4">
                <h6 class="small fw-800 text-uppercase mb-4 opacity-50 d-flex justify-content-between">
                    Color Metrics <i class="bi bi-info-circle"></i>
                </h6>
                <div class="vstack gap-3">
                    <div class="metric-row p-3 bg-dark bg-opacity-50 rounded-3">
                        <label class="small text-muted mb-1 fw-bold text-uppercase">RGB (Red, Green, Blue)</label>
                        <div class="d-flex justify-content-between">
                            <span id="rgb-val" class="font-monospace text-white">250, 204, 21</span>
                            <button class="btn btn-sm p-0 text-accent" onclick="copyText('rgb-val')"><i class="bi bi-clipboard"></i></button>
                        </div>
                    </div>
                    <div class="metric-row p-3 bg-dark bg-opacity-50 rounded-3">
                        <label class="small text-muted mb-1 fw-bold text-uppercase">HSL (Hue, Sat, Light)</label>
                        <div class="d-flex justify-content-between">
                            <span id="hsl-val" class="font-monospace text-white">48°, 95%, 53%</span>
                            <button class="btn btn-sm p-0 text-accent" onclick="copyText('hsl-val')"><i class="bi bi-clipboard"></i></button>
                        </div>
                    </div>
                    <div class="metric-row p-3 bg-dark bg-opacity-50 rounded-3">
                        <label class="small text-muted mb-1 fw-bold text-uppercase">LAB (Lightness, a*, b*)</label>
                        <div class="d-flex justify-content-between">
                            <span id="lab-val" class="font-monospace text-white">L:82 a:6 b:81</span>
                            <button class="btn btn-sm p-0 text-accent" onclick="copyText('lab-val')"><i class="bi bi-clipboard"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4">
                <h6 class="small fw-800 text-uppercase mb-4 opacity-50">Harmony Architecture</h6>
                <select id="harmony-select" class="form-select bg-dark bg-opacity-50 border-0 text-white rounded-3 py-3 fw-bold">
                    <option value="monochrome">Monochromatic</option>
                    <option value="analogous">Analogous</option>
                    <option value="complementary" selected>Complementary</option>
                    <option value="split">Split Complementary</option>
                    <option value="triad">Triadic</option>
                    <option value="square">Square</option>
                </select>
            </div>
        </div>

        <!-- Palette Engine -->
        <div class="col-lg-8">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 h-100 position-relative overflow-hidden">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h6 class="small fw-800 text-uppercase mb-0 opacity-50">Generated Harmonies</h6>
                    <div class="dropdown">
                        <button class="btn btn-accent btn-sm rounded-pill px-4 fw-bold shadow-accent dropdown-toggle" data-bs-toggle="dropdown">
                            EXPORT PALETTE
                        </button>
                        <ul class="dropdown-menu dropdown-menu-dark border-0 shadow-lg">
                            <li><a class="dropdown-item py-2 fw-600" href="#" onclick="exportPalette('css')">Copy CSS Vars</a></li>
                            <li><a class="dropdown-item py-2 fw-600" href="#" onclick="exportPalette('json')">Download JSON</a></li>
                        </ul>
                    </div>
                </div>
                
                <div id="palette-grid" class="row g-3 h-100 align-content-start">
                    <!-- Palette items injected -->
                </div>

                <div class="mt-4 p-3 bg-dark bg-opacity-25 rounded-4 border border-white border-opacity-5">
                    <h6 class="small fw-800 text-muted text-uppercase mb-3">Shade Spectrum</h6>
                    <div id="shade-spectrum" class="d-flex gap-1 h-2rem rounded-3 overflow-hidden" style="height: 40px;">
                        <!-- Spectrum shades -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .palette-card {
        height: 200px;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        cursor: pointer;
        border: 1px solid rgba(255,255,255,0.05);
    }
    .palette-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }
    .palette-card .hex-label {
        position: absolute;
        bottom: 1rem; left: 0; right: 0;
        text-align: center;
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(8px);
        margin: 0 1rem;
        padding: 5px;
        border-radius: 8px;
        font-size: 0.7rem;
        font-weight: 800;
        opacity: 0;
        transition: opacity 0.3s ease;
    }
    .palette-card:hover .hex-label { opacity: 1; }
    .shadow-accent { box-shadow: 0 8px 25px rgba(250, 204, 21, 0.2); }
</style>

<script>
    (function() {
        const picker = document.getElementById('color-picker');
        const hexInput = document.getElementById('hex-input');
        const harmonySelect = document.getElementById('harmony-select');
        const paletteGrid = document.getElementById('palette-grid');
        const shadeSpectrum = document.getElementById('shade-spectrum');

        function updateAll(hex, isSilent = false) {
            if (!/^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$/.test(hex)) return;
            picker.value = hex;
            hexInput.value = hex;
            
            localStorage.setItem('hub-color-hex', hex);
            localStorage.setItem('hub-color-harmony', harmonySelect.value);

            const rgb = hexToRgb(hex);
            const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
            const lab = rgbToLab(rgb.r, rgb.g, rgb.b);

            document.getElementById('rgb-val').textContent = `${rgb.r}, ${rgb.g}, ${rgb.b}`;
            document.getElementById('hsl-val').textContent = `${Math.round(hsl.h)}°, ${Math.round(hsl.s)}%, ${Math.round(hsl.l)}%`;
            document.getElementById('lab-val').textContent = `L:${Math.round(lab.l)} a:${Math.round(lab.a)} b:${Math.round(lab.b)}`;

            generatePalette(hex, harmonySelect.value);
            generateShades(hex);

            if (!isSilent) {
                logActivity('Design', `Color updated to ${hex.toUpperCase()}`);
            }
        }

        function generatePalette(baseHex, type) {
            const rgb = hexToRgb(baseHex);
            const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
            let colors = [baseHex];

            switch(type) {
                case 'monochrome':
                    colors = [30, 45, 60, 75, 90].map(l => hslToHex(hsl.h, hsl.s, l));
                    break;
                case 'complementary':
                    colors = [baseHex, hslToHex((hsl.h + 180) % 360, hsl.s, hsl.l)];
                    break;
                case 'analogous':
                    colors = [-30, -15, 0, 15, 30].map(d => hslToHex((hsl.h + d + 360) % 360, hsl.s, hsl.l));
                    break;
                case 'triad':
                    colors = [0, 120, 240].map(d => hslToHex((hsl.h + d) % 360, hsl.s, hsl.l));
                    break;
                case 'split':
                    colors = [0, 150, 210].map(d => hslToHex((hsl.h + d) % 360, hsl.s, hsl.l));
                    break;
                case 'square':
                    colors = [0, 90, 180, 270].map(d => hslToHex((hsl.h + d) % 360, hsl.s, hsl.l));
                    break;
            }

            paletteGrid.innerHTML = colors.map(c => `
                <div class="col">
                    <div class="palette-card rounded-4 position-relative" style="background: ${c}" onclick="updateAll('${c}')">
                        <div class="hex-label text-white font-monospace">${c.toUpperCase()}</div>
                    </div>
                </div>
            `).join('');
        }

        function generateShades(hex) {
            const rgb = hexToRgb(hex);
            const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
            shadeSpectrum.innerHTML = Array.from({length: 10}).map((_, i) => {
                const shade = hslToHex(hsl.h, hsl.s, 10 * i + 5);
                return `<div class="flex-fill" style="background: ${shade}; cursor: pointer;" onclick="updateAll('${shade}')"></div>`;
            }).join('');
        }

        // Helpers
        function hexToRgb(hex) {
            let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return {r, g, b};
        }

        function rgbToHsl(r, g, b) {
            r /= 255, g /= 255, b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max == min) h = s = 0;
            else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                if (max == r) h = (g - b) / d + (g < b ? 6 : 0);
                else if (max == g) h = (b - r) / d + 2;
                else h = (r - g) / d + 4;
                h /= 6;
            }
            return { h: h * 360, s: s * 100, l: l * 100 };
        }

        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        function rgbToLab(r, g, b) {
            let x = r * 0.4124 + g * 0.3576 + b * 0.1805, y = r * 0.2126 + g * 0.7152 + b * 0.0722, z = r * 0.0193 + g * 0.1192 + b * 0.9505;
            x /= 95.047, y /= 100, z /= 108.883;
            x = x > 0.008856 ? Math.pow(x, 1/3) : (7.787 * x) + 16/116;
            y = y > 0.008856 ? Math.pow(y, 1/3) : (7.787 * y) + 16/116;
            z = z > 0.008856 ? Math.pow(z, 1/3) : (7.787 * z) + 16/116;
            return { l: (116 * y) - 16, a: 500 * (x - y), b: 200 * (y - z) };
        }

        window.copyText = (id) => {
            const txt = document.getElementById(id).textContent;
            navigator.clipboard.writeText(txt);
        }

        window.exportPalette = (format) => {
            const colors = Array.from(paletteGrid.querySelectorAll('.hex-label')).map(el => el.textContent);
            if (format === 'css') {
                const css = colors.map((c, i) => `--color-${i + 1}: ${c};`).join('\n');
                navigator.clipboard.writeText(css);
                alert('CSS Variables copied to clipboard!');
            } else {
                const blob = new Blob([JSON.stringify(colors, null, 4)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'palette.json';
                a.click();
            }
            logActivity('Design', `Exported palette as ${format.toUpperCase()}`);
        }

        picker.addEventListener('input', e => updateAll(e.target.value));
        hexInput.addEventListener('change', e => updateAll(e.target.value));
        harmonySelect.addEventListener('change', () => updateAll(picker.value));

        // Load saved state
        const savedHex = localStorage.getItem('hub-color-hex') || '#facc15';
        const savedHarmony = localStorage.getItem('hub-color-harmony') || 'complementary';
        harmonySelect.value = savedHarmony;
        updateAll(savedHex, true);
    })();
</script>
