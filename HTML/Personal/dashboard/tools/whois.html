<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">Whois Lookup</h1>
            <p class="text-muted mb-0">Retrieve domain registration and ownership details.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <div class="d-inline-flex bg-secondary bg-opacity-10 p-2 rounded-4 border border-white border-opacity-5">
                <input type="text" id="whois-domain" class="form-control bg-transparent border-0 text-white" placeholder="example.com" style="width: 250px;">
                <button class="btn btn-accent rounded-3 px-3" onclick="doWhois()">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4">
                <h6 class="small fw-800 text-uppercase mb-4 opacity-50">Results</h6>
                <textarea id="whois-result" class="form-control bg-dark bg-opacity-50 border-0 text-white font-monospace p-4" 
                          style="height: 400px; resize: none;" readonly placeholder="Data will appear here..."></textarea>
            </div>
        </div>
    </div>
</div>

<script>
    async function doWhois() {
        const domain = document.getElementById('whois-domain').value.trim();
        const out = document.getElementById('whois-result');
        if(!domain) return;

        out.value = `Searching Whois data for ${domain}...`;
        
        try {
            // Using a free RDAP API (Modern WHOIS)
            const response = await fetch(`https://rdap.org/domain/${domain}`);
            const data = await response.json();
            out.value = JSON.stringify(data, null, 4);
            logActivity('Security', `Whois lookup: ${domain}`);
        } catch (e) {
            out.value = "Error: Could not retrieve data. The domain might not be supported by RDAP or is restricted.";
        }
    }
</script>
