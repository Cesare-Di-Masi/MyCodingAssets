<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">Units Converter</h1>
            <p class="text-muted mb-0">Instantly switch between PX, REM, EM, and Percentage units.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <div class="d-inline-flex bg-secondary bg-opacity-10 p-2 rounded-4">
                <span class="small fw-bold text-muted px-2 align-self-center">Base Size (PX):</span>
                <input type="number" id="base-size" class="form-control bg-transparent border-0 text-white fw-bold" value="16" style="width: 80px;" oninput="updateFrom('px')">
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-3">
            <div class="card border-0 rounded-4 p-4 shadow-sm" style="background: var(--bg-secondary);">
                <label class="small text-muted fw-800 text-uppercase mb-3 opacity-50">Pixels (PX)</label>
                <input type="number" id="unit-px" class="form-control form-control-lg bg-dark bg-opacity-25 border-0 text-white fw-800" value="16" oninput="updateFrom('px')">
            </div>
        </div>
        <div class="col-lg-3">
            <div class="card border-0 rounded-4 p-4 shadow-sm" style="background: var(--bg-secondary);">
                <label class="small text-muted fw-800 text-uppercase mb-3 opacity-50">REM</label>
                <input type="number" id="unit-rem" class="form-control form-control-lg bg-dark bg-opacity-25 border-0 text-white fw-800" value="1" oninput="updateFrom('rem')">
            </div>
        </div>
        <div class="col-lg-3">
            <div class="card border-0 rounded-4 p-4 shadow-sm" style="background: var(--bg-secondary);">
                <label class="small text-muted fw-800 text-uppercase mb-3 opacity-50">EM</label>
                <input type="number" id="unit-em" class="form-control form-control-lg bg-dark bg-opacity-25 border-0 text-white fw-800" value="1" oninput="updateFrom('em')">
            </div>
        </div>
        <div class="col-lg-3">
            <div class="card border-0 rounded-4 p-4 shadow-sm" style="background: var(--bg-secondary);">
                <label class="small text-muted fw-800 text-uppercase mb-3 opacity-50">Percent (%)</label>
                <input type="number" id="unit-perc" class="form-control form-control-lg bg-dark bg-opacity-25 border-0 text-white fw-800" value="100" oninput="updateFrom('perc')">
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const baseEl = document.getElementById('base-size');
        const pxEl = document.getElementById('unit-px');
        const remEl = document.getElementById('unit-rem');
        const emEl = document.getElementById('unit-em');
        const percEl = document.getElementById('unit-perc');

        // Load saved state
        baseEl.value = localStorage.getItem('hub-unit-base') || '16';
        pxEl.value = localStorage.getItem('hub-unit-px') || '16';

        window.updateFrom = function(type, isSilent = false) {
            const base = parseFloat(baseEl.value) || 16;
            
            if (type === 'px') {
                remEl.value = (pxEl.value / base).toFixed(3);
                emEl.value = remEl.value;
                percEl.value = (remEl.value * 100).toFixed(1);
            } else if (type === 'rem' || type === 'em') {
                const val = type === 'rem' ? remEl.value : emEl.value;
                pxEl.value = (val * base).toFixed(0);
                if(type === 'rem') emEl.value = remEl.value; else remEl.value = emEl.value;
                percEl.value = (val * 100).toFixed(1);
            } else if (type === 'perc') {
                pxEl.value = (percEl.value / 100 * base).toFixed(0);
                remEl.value = (percEl.value / 100).toFixed(3);
                emEl.value = remEl.value;
            }

            localStorage.setItem('hub-unit-base', baseEl.value);
            localStorage.setItem('hub-unit-px', pxEl.value);
            
            if (!isSilent) {
                logActivity('Units Converter', `Converted ${type}`);
            }
        }

        // Initialize values silently
        updateFrom('px', true);
    })();
</script>
