<div class="animate-fade-in">
    <div class="row mb-5">
        <div class="col-7">
            <h1 class="fw-800 mb-1">Habit Tracker</h1>
            <p class="text-muted mb-0">Monitor your daily discipline with a visual grid.</p>
        </div>
        <div class="col-5 text-end">
            <button class="btn btn-accent px-4 py-2 fw-bold" onclick="addHabit()">
                <i class="bi bi-plus-lg me-1"></i> New Habit
            </button>
        </div>
    </div>

    <div class="row g-4" id="habits-list">
        <!-- Habits injected -->
    </div>
</div>

<script>
    (function() {
        let habits = JSON.parse(localStorage.getItem('hub-habits') || '[{"name": "Code for 2h", "streak": 5}, {"name": "Read 20m", "streak": 12}]');

        window.renderHabits = function() {
            const list = document.getElementById('habits-list');
            list.innerHTML = '';
            
            habits.forEach((h, i) => {
                const col = document.createElement('div');
                col.className = 'col-md-6';
                
                const card = document.createElement('div');
                card.className = 'card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 d-flex flex-row align-items-center justify-content-between';
                
                const info = document.createElement('div');
                const title = document.createElement('h6');
                title.className = 'fw-800 mb-1';
                title.textContent = h.name;
                
                const sub = document.createElement('p');
                sub.className = 'small text-muted mb-0';
                sub.innerHTML = `Current Streak: <span class="text-accent fw-bold">${h.streak} days</span>`;
                
                info.appendChild(title);
                info.appendChild(sub);
                
                const btn = document.createElement('button');
                btn.className = 'btn btn-accent rounded-circle';
                btn.style.width = '42px';
                btn.style.height = '42px';
                btn.innerHTML = '<i class="bi bi-check-lg text-black"></i>';
                btn.onclick = () => incStreak(i);
                
                card.appendChild(info);
                card.appendChild(btn);
                col.appendChild(card);
                list.appendChild(col);
            });
            
            localStorage.setItem('hub-habits', JSON.stringify(habits));
        }

        window.addHabit = function() {
            const name = prompt("Habit name:");
            if(name) {
                habits.push({ name, streak: 0 });
                renderHabits();
                logActivity('Productivity', 'Added habit: ' + name);
            }
        }

        window.incStreak = function(i) {
            habits[i].streak++;
            renderHabits();
        }

        renderHabits();
    })();
</script>
