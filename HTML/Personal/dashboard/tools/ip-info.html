<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">IP Detector</h1>
            <p class="text-muted mb-0">Discover your public IP address and geolocation data.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <button class="btn btn-accent px-4 py-2 fw-bold" onclick="getIP()">
                <i class="bi bi-geo-alt-fill me-1"></i> Refresh Data
            </button>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-12">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-5 text-center">
                <h6 class="small fw-800 text-uppercase opacity-50 mb-3">Your Public IP</h6>
                <h1 class="display-3 fw-800 text-accent mb-4" id="ip-val" style="color: var(--accent);">...</h1>
                
                <div class="row g-4 mt-2 justify-content-center text-start">
                    <div class="col-md-3">
                        <div class="p-3 bg-dark bg-opacity-25 rounded-3 border border-white border-opacity-5">
                            <label class="small text-muted fw-bold d-block">Location</label>
                            <span id="ip-loc" class="fw-bold">...</span>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="p-3 bg-dark bg-opacity-25 rounded-3 border border-white border-opacity-5">
                            <label class="small text-muted fw-bold d-block">ISP</label>
                            <span id="ip-isp" class="fw-bold">...</span>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="p-3 bg-dark bg-opacity-25 rounded-3 border border-white border-opacity-5">
                            <label class="small text-muted fw-bold d-block">Timezone</label>
                            <span id="ip-tz" class="fw-bold">...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const ipEl = document.getElementById('ip-val');
        const locEl = document.getElementById('ip-loc');
        const ispEl = document.getElementById('ip-isp');
        const tzEl = document.getElementById('ip-tz');

        window.getIP = async function(isSilent = false) {
            ipEl.textContent = "Detecting...";
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                ipEl.textContent = data.ip;
                locEl.textContent = `${data.city}, ${data.region}, ${data.country_name}`;
                ispEl.textContent = data.org;
                tzEl.textContent = data.timezone;
                
                localStorage.setItem('hub-ip-data', JSON.stringify(data));
                
                if (!isSilent) {
                    logActivity('Security', `IP Detected: ${data.ip}`);
                }
            } catch (e) {
                ipEl.textContent = "Error";
                ipEl.className = "display-3 fw-800 text-danger mb-4";
            }
        }

        // Load cached data
        const cached = localStorage.getItem('hub-ip-data');
        if (cached) {
            try {
                const data = JSON.parse(cached);
                ipEl.textContent = data.ip;
                locEl.textContent = `${data.city || '...'}, ${data.region || '...'}, ${data.country_name || '...'}`;
                ispEl.textContent = data.org || '...';
                tzEl.textContent = data.timezone || '...';
            } catch (e) {
                getIP(true);
            }
        } else {
            getIP(true);
        }
    })();
</script>
