<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">Shadow Builder</h1>
            <p class="text-muted mb-0">Visual UI to create complex, smooth layered CSS box-shadows.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <button class="btn btn-accent px-4 py-2 fw-bold" onclick="copyShadow()">
                <i class="bi bi-clipboard me-1"></i> Copy Shadow
            </button>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4">
                <div class="mb-4">
                    <label class="small text-muted fw-bold mb-2">Shift X: <span id="sh-x-v">10</span>px</label>
                    <input type="range" id="sh-x" class="form-range" min="-50" max="50" value="10" oninput="updateShadow()">
                </div>
                <div class="mb-4">
                    <label class="small text-muted fw-bold mb-2">Shift Y: <span id="sh-y-v">10</span>px</label>
                    <input type="range" id="sh-y" class="form-range" min="-50" max="50" value="10" oninput="updateShadow()">
                </div>
                <div class="mb-4">
                    <label class="small text-muted fw-bold mb-2">Blur: <span id="sh-b-v">20</span>px</label>
                    <input type="range" id="sh-b" class="form-range" min="0" max="100" value="20" oninput="updateShadow()">
                </div>
                <div class="mb-0">
                    <label class="small text-muted fw-bold mb-2">Opacity: <span id="sh-o-v">0.2</span></label>
                    <input type="range" id="sh-o" class="form-range" min="0" max="1" step="0.05" value="0.2" oninput="updateShadow()">
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card border-0 rounded-4 d-flex align-items-center justify-content-center" style="height: 300px; background: var(--bg-secondary);">
                <div id="shadow-box" class="rounded-4 bg-white" style="width: 150px; height: 150px; box-shadow: 10px 10px 20px rgba(0,0,0,0.2);"></div>
            </div>
            <div class="card bg-dark bg-opacity-50 border-0 rounded-4 p-3 mt-4">
                <code class="text-accent small fw-bold" id="shadow-code">box-shadow: 10px 10px 20px rgba(0,0,0,0.2);</code>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const xEl = document.getElementById('sh-x');
        const yEl = document.getElementById('sh-y');
        const bEl = document.getElementById('sh-b');
        const oEl = document.getElementById('sh-o');

        // Load saved state
        xEl.value = localStorage.getItem('hub-sh-x') || '10';
        yEl.value = localStorage.getItem('hub-sh-y') || '10';
        bEl.value = localStorage.getItem('hub-sh-b') || '20';
        oEl.value = localStorage.getItem('hub-sh-o') || '0.2';

        window.updateShadow = function(isSilent = false) {
            const x = xEl.value;
            const y = yEl.value;
            const b = bEl.value;
            const o = oEl.value;
            
            localStorage.setItem('hub-sh-x', x);
            localStorage.setItem('hub-sh-y', y);
            localStorage.setItem('hub-sh-b', b);
            localStorage.setItem('hub-sh-o', o);

            document.getElementById('sh-x-v').textContent = x;
            document.getElementById('sh-y-v').textContent = y;
            document.getElementById('sh-b-v').textContent = b;
            document.getElementById('sh-o-v').textContent = o;

            const val = `${x}px ${y}px ${b}px rgba(0,0,0,${o})`;
            document.getElementById('shadow-box').style.boxShadow = val;
            document.getElementById('shadow-code').textContent = `box-shadow: ${val};`;
            
            if (!isSilent) {
                logActivity('Design', 'Updated shadow parameters');
            }
        }

        window.copyShadow = async function() {
            const text = document.getElementById('shadow-code').textContent;
            try {
                await navigator.clipboard.writeText(text);
                alert('Shadow Copied!');
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
        }

        // Initialize values silently
        updateShadow(true);
    })();
</script>
