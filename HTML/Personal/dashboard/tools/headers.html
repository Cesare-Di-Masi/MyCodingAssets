<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">Headers Audit</h1>
            <p class="text-muted mb-0">Inspect HTTP response headers for security best practices (HSTS, CSP, X-Frame-Options).</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <div class="d-inline-flex bg-secondary bg-opacity-10 p-2 rounded-4 border border-white border-opacity-5">
                <input type="text" id="header-url" class="form-control bg-transparent border-0 text-white" placeholder="https://google.com" style="width: 250px;">
                <button class="btn btn-accent rounded-3 px-3" onclick="auditHeaders()">
                    <i class="bi bi-shield-lock-fill"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4">
                <div id="header-results">
                    <div class="text-muted small">Enter a URL to audit its security headers. Note: Direct browser fetches may be limited by CORS.</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const urlEl = document.getElementById('header-url');
        const results = document.getElementById('header-results');

        // Load saved state
        urlEl.value = localStorage.getItem('hub-header-url') || '';

        window.auditHeaders = async function() {
            const url = urlEl.value.trim();
            if(!url) return;
            
            localStorage.setItem('hub-header-url', url);

            results.innerHTML = `<div class="spinner-border spinner-border-sm text-accent me-2"></div> Auditing ${url}...`;

            try {
                // Browsers block reading headers from other domains via fetch.
                await fetch(url, { mode: 'no-cors' });
                
                results.innerHTML = `
                    <div class="alert alert-info border-0 rounded-4 p-4">
                        <h6 class="fw-bold mb-2"><i class="bi bi-info-circle-fill me-2"></i>CORS Limitation</h6>
                        <p class="small mb-0">Due to browser security (CORS), client-side JavaScript cannot read HTTP headers from external domains directly. In a production environment, this would be routed through a backend proxy.</p>
                    </div>
                    <div class="p-4 bg-dark bg-opacity-25 rounded-4 mt-4">
                        <h6 class="fw-800 text-uppercase small opacity-50 mb-3">Audited URL</h6>
                        <code class="text-accent fw-bold" id="res-url"></code>
                    </div>
                `;
                document.getElementById('res-url').textContent = url;
                logActivity('Security', `Header audit attempt: ${url}`);
            } catch (e) {
                results.innerHTML = `<div class="text-danger">Invalid URL or network error.</div>`;
            }
        }
    })();
</script>
