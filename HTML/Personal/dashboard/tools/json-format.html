<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">JSON Formatter</h1>
            <p class="text-muted mb-0">Prettify, minify and validate your JSON data.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <button class="btn btn-accent px-4 py-2 fw-bold" onclick="processJSON('format')">
                <i class="bi bi-magic me-1"></i> Prettify
            </button>
            <button class="btn btn-dark border border-white border-opacity-10 px-4 py-2 ms-2 fw-bold text-white" onclick="processJSON('minify')">
                Minify
            </button>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-12">
            <div class="card border-0 rounded-4 shadow-sm" style="background: var(--bg-secondary);">
                <div class="card-header bg-transparent border-white border-opacity-5 p-3 d-flex justify-content-between align-items-center">
                    <span class="small fw-800 text-uppercase opacity-50 px-2">Input / Output</span>
                    <button class="btn btn-link btn-sm text-decoration-none text-muted" onclick="copyResult()">
                        <i class="bi bi-clipboard me-1"></i> Copy
                    </button>
                </div>
                <div class="card-body p-0">
                    <textarea id="json-input" class="form-control bg-transparent border-0 p-4 font-monospace" 
                              style="height: 500px; color: var(--text-main); font-size: 0.9rem; resize: none;" 
                              placeholder="Paste your JSON here..."></textarea>
                </div>
            </div>
            <div id="json-status" class="mt-3 small px-2"></div>
        </div>
    </div>
</div>

<script>
    (function() {
        const input = document.getElementById('json-input');
        const status = document.getElementById('json-status');

        input.value = localStorage.getItem('hub-json-input') || '';

        window.processJSON = function(mode) {
            try {
                const parsed = JSON.parse(input.value);
                input.value = mode === 'format' ? JSON.stringify(parsed, null, 4) : JSON.stringify(parsed);
                status.className = "mt-3 small px-2 text-success fw-bold";
                status.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> Valid JSON';
                localStorage.setItem('hub-json-input', input.value);
                logActivity('Development', mode === 'format' ? 'Formatted JSON' : 'Minified JSON');
            } catch (e) {
                status.className = "mt-3 small px-2 text-danger fw-bold";
                status.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-1"></i> Invalid JSON: ' + e.message;
            }
        }

        window.copyResult = function() {
            input.select();
            document.execCommand('copy');
            alert('Copied to clipboard!');
        }

        input.addEventListener('input', () => {
            localStorage.setItem('hub-json-input', input.value);
        });
    })();
</script>
