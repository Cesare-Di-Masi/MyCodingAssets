<div class="animate-fade-in">
    <div class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">Contrast Checker</h1>
            <p class="text-muted mb-0">Check WCAG accessibility contrast ratios between colors.</p>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 mb-4">
                <div class="mb-4">
                    <label class="small text-muted fw-bold mb-2">Foreground (Text)</label>
                    <input type="color" id="contrast-fg" class="form-control bg-dark bg-opacity-25 border-0 p-1" value="#000000" oninput="checkContrast()">
                </div>
                <div class="mb-0">
                    <label class="small text-muted fw-bold mb-2">Background</label>
                    <input type="color" id="contrast-bg" class="form-control bg-dark bg-opacity-25 border-0 p-1" value="#facc15" oninput="checkContrast()">
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card border-0 rounded-4 p-5 mb-4 text-center" id="contrast-preview" style="background: #facc15; color: #000;">
                <h2 class="fw-800 mb-2">The quick brown fox</h2>
                <p class="mb-0">Jumps over the lazy dog.</p>
            </div>
            
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 text-center">
                        <h6 class="text-muted small fw-bold mb-1">Ratio</h6>
                        <h2 class="fw-800 mb-0" id="contrast-ratio">19.56:1</h2>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 text-center">
                        <h6 class="text-muted small fw-bold mb-1">Status</h6>
                        <h2 class="fw-800 mb-0 text-success" id="contrast-status">PASS (AAA)</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const fgEl = document.getElementById('contrast-fg');
        const bgEl = document.getElementById('contrast-bg');
        const preview = document.getElementById('contrast-preview');
        const ratioEl = document.getElementById('contrast-ratio');
        const statusEl = document.getElementById('contrast-status');

        // Load saved state
        fgEl.value = localStorage.getItem('hub-contrast-fg') || '#000000';
        bgEl.value = localStorage.getItem('hub-contrast-bg') || '#facc15';

        window.checkContrast = function(isSilent = false) {
            const fg = fgEl.value;
            const bg = bgEl.value;

            localStorage.setItem('hub-contrast-fg', fg);
            localStorage.setItem('hub-contrast-bg', bg);

            preview.style.color = fg;
            preview.style.backgroundColor = bg;

            const ratio = calculateRatio(fg, bg);
            ratioEl.textContent = ratio.toFixed(2) + ":1";

            if (ratio >= 7) {
                statusEl.textContent = "PASS (AAA)";
                statusEl.className = "fw-800 mb-0 text-success";
            } else if (ratio >= 4.5) {
                statusEl.textContent = "PASS (AA)";
                statusEl.className = "fw-800 mb-0 text-success";
            } else {
                statusEl.textContent = "FAIL";
                statusEl.className = "fw-800 mb-0 text-danger";
            }

            if (!isSilent) {
                logActivity('Design', `Checked contrast ratio: ${ratio.toFixed(2)}`);
            }
        }

        function hexToLuminance(hex) {
            const rgb = hex.match(/[A-Za-z0-9]{2}/g).map(v => parseInt(v, 16) / 255);
            const [r, g, b] = rgb.map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
            return 0.2126 * r + 0.7152 * g + 0.0722 * b;
        }

        function calculateRatio(h1, h2) {
            const l1 = hexToLuminance(h1);
            const l2 = hexToLuminance(h2);
            return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
        }

        checkContrast(true);
    })();
</script>
