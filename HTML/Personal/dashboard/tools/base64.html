<div class="animate-fade-in">
    <div class="row mb-5">
        <div class="col-7">
            <h1 class="fw-800 mb-1">Base64 Tool</h1>
            <p class="text-muted mb-0">Encode or decode text and binary data into Base64 format.</p>
        </div>
        <div class="col-5 text-end">
            <div class="btn-group">
                <button class="btn btn-accent px-4 py-2 fw-bold" onclick="processBase64('encode')">Encode</button>
                <button class="btn btn-dark border border-white border-opacity-10 px-4 py-2 fw-bold text-white" onclick="processBase64('decode')">Decode</button>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card border-0 rounded-4 shadow-sm" style="background: var(--bg-secondary);">
                <div class="card-header bg-transparent border-white border-opacity-5 p-3">
                    <span class="small fw-800 text-uppercase opacity-50 px-2">Input Text</span>
                </div>
                <div class="card-body p-0">
                    <textarea id="b64-input" class="form-control bg-transparent border-0 p-4 font-monospace" 
                              style="height: 400px; color: var(--text-main); font-size: 0.9rem; resize: none;" 
                              placeholder="Type or paste here..."></textarea>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card border-0 rounded-4 shadow-sm" style="background: var(--bg-secondary);">
                <div class="card-header bg-transparent border-white border-opacity-5 p-3 d-flex justify-content-between align-items-center">
                    <span class="small fw-800 text-uppercase opacity-50 px-2">Output Result</span>
                    <button class="btn btn-link btn-sm text-decoration-none text-muted p-0" onclick="copyB64()">Copy</button>
                </div>
                <div class="card-body p-0">
                    <textarea id="b64-output" class="form-control bg-transparent border-0 p-4 font-monospace" 
                              style="height: 400px; color: var(--text-main); font-size: 0.9rem; resize: none;" 
                              placeholder="Result will appear here..."></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const input = document.getElementById('b64-input');
        const output = document.getElementById('b64-output');

        // Load saved state
        input.value = localStorage.getItem('hub-b64-input') || '';
        output.value = localStorage.getItem('hub-b64-output') || '';

        window.processBase64 = function(mode) {
            try {
                if (mode === 'encode') output.value = btoa(input.value);
                else output.value = atob(input.value);
                
                localStorage.setItem('hub-b64-input', input.value);
                localStorage.setItem('hub-b64-output', output.value);
                logActivity('Development', mode === 'encode' ? 'Encoded text' : 'Decoded text');
            } catch (e) {
                output.value = "Error: Invalid input for " + mode;
            }
        }

        window.copyB64 = function() {
            output.select();
            document.execCommand('copy');
            alert('Copied to clipboard!');
        }

        input.addEventListener('input', () => {
            localStorage.setItem('hub-b64-input', input.value);
        });
    })();
</script>
