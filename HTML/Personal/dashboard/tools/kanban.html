<div class="animate-fade-in">
    <div class="row mb-5 align-items-center">
        <div class="col-md-7">
            <h1 class="fw-800 mb-1">Kanban Engine <span class="badge bg-accent text-black small">PRO</span></h1>
            <p class="text-muted mb-0">High-performance project management with native drag & drop.</p>
        </div>
        <div class="col-md-5 text-md-end mt-3 mt-md-0">
            <button class="btn btn-accent px-5 py-2 fw-bold shadow-accent" onclick="createNewKanbanCard()">
                <i class="bi bi-plus-lg me-2"></i> NEW MISSION
            </button>
        </div>
    </div>

    <div class="row g-4 kanban-board">
        <!-- Todo Column -->
        <div class="col-md-4">
            <div class="kanban-column p-4 rounded-4" ondrop="drop(event, 'todo')" ondragover="allowDrop(event)">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h6 class="small fw-900 text-uppercase tracking-wider mb-0">Backlog <span class="ms-2 opacity-25" id="count-todo">0</span></h6>
                    <i class="bi bi-three-dots opacity-50"></i>
                </div>
                <div id="col-todo" class="kanban-items-container"></div>
            </div>
        </div>
        <!-- In Progress Column -->
        <div class="col-md-4">
            <div class="kanban-column p-4 rounded-4" ondrop="drop(event, 'progress')" ondragover="allowDrop(event)">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h6 class="small fw-900 text-uppercase tracking-wider mb-0 text-accent">Active <span class="ms-2 opacity-25" id="count-progress">0</span></h6>
                    <i class="bi bi-play-circle-fill text-accent"></i>
                </div>
                <div id="col-progress" class="kanban-items-container"></div>
            </div>
        </div>
        <!-- Done Column -->
        <div class="col-md-4">
            <div class="kanban-column p-4 rounded-4" ondrop="drop(event, 'done')" ondragover="allowDrop(event)">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h6 class="small fw-900 text-uppercase tracking-wider mb-0 text-success">Finished <span class="ms-2 opacity-25" id="count-done">0</span></h6>
                    <i class="bi bi-check-circle-fill text-success"></i>
                </div>
                <div id="col-done" class="kanban-items-container"></div>
            </div>
        </div>
    </div>
</div>

<style>
    .kanban-column {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        min-height: 70vh;
        transition: border-color 0.3s ease;
    }
    .kanban-column.drag-over {
        border-color: var(--accent);
        background: rgba(250, 204, 21, 0.02);
    }
    .kanban-card {
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        padding: 1.25rem;
        border-radius: 16px;
        margin-bottom: 1rem;
        cursor: grab;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
    }
    .kanban-card:active { cursor: grabbing; }
    .kanban-card:hover {
        transform: translateY(-4px);
        border-color: rgba(255,255,255,0.1);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .kanban-card.dragging {
        opacity: 0.4;
        transform: scale(0.95);
    }
    .priority-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 8px;
    }
    .shadow-accent { box-shadow: 0 8px 25px rgba(250, 204, 21, 0.2); }
</style>

<script>
    (function() {
        let board = JSON.parse(localStorage.getItem('hub-kanban-v2') || '{"todo": [{"id":1,"text":"Research Quantum APIs","priority":"high"},{"id":2,"text":"Draft architecture","priority":"med"}], "progress": [{"id":3,"text":"Coding dashboard v6","priority":"high"}], "done": [{"id":4,"text":"Security Audit","priority":"low"}]}');

        window.allowDrop = (e) => {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        window.drag = (e, id, fromCol) => {
            e.dataTransfer.setData("cardId", id);
            e.dataTransfer.setData("fromCol", fromCol);
            e.target.classList.add('dragging');
        }

        window.drop = (e, toCol) => {
            e.preventDefault();
            const col = e.currentTarget;
            col.classList.remove('drag-over');
            
            const cardId = parseInt(e.dataTransfer.getData("cardId"));
            const fromCol = e.dataTransfer.getData("fromCol");
            
            if(fromCol === toCol) return;

            const cardIndex = board[fromCol].findIndex(c => c.id === cardId);
            const [card] = board[fromCol].splice(cardIndex, 1);
            board[toCol].push(card);
            
            saveAndRender();
            logActivity('Productivity', `Moved card #${cardId} to ${toCol}`);
        }

        window.createNewKanbanCard = () => {
            const text = prompt("Mission Name:");
            if(!text) return;
            const priority = prompt("Priority (high/med/low):", "med").toLowerCase();
            
            const newCard = {
                id: Date.now(),
                text,
                priority: ['high','med','low'].includes(priority) ? priority : 'med'
            };
            
            board.todo.push(newCard);
            saveAndRender();
        }

        window.deleteKanbanCard = (col, id) => {
            board[col] = board[col].filter(c => c.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('hub-kanban-v2', JSON.stringify(board));
            render();
        }

        function render() {
            for (let colKey in board) {
                const container = document.getElementById(`col-${colKey}`);
                const count = document.getElementById(`count-${colKey}`);
                count.textContent = board[colKey].length;
                
                container.innerHTML = board[colKey].map(card => `
                    <div class="kanban-card shadow-sm" draggable="true" ondragstart="drag(event, ${card.id}, '${colKey}')" ondragend="this.classList.remove('dragging')">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div class="d-flex align-items-center">
                                <span class="priority-dot bg-${card.priority === 'high' ? 'danger' : (card.priority === 'med' ? 'warning' : 'info')}"></span>
                                <span class="small fw-800 text-uppercase opacity-50" style="font-size: 0.6rem;">${card.priority}</span>
                            </div>
                            <button class="btn btn-sm p-0 text-danger opacity-50" onclick="deleteKanbanCard('${colKey}', ${card.id})"><i class="bi bi-x-circle"></i></button>
                        </div>
                        <p class="mb-0 fw-600 small">${card.text}</p>
                    </div>
                `).join('');
            }
        }

        // Handle dragleave
        document.querySelectorAll('.kanban-column').forEach(col => {
            col.addEventListener('dragleave', e => e.currentTarget.classList.remove('drag-over'));
        });

        render();
    })();
</script>
