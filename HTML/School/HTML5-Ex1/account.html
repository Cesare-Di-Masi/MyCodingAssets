<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestione Account - TechBlog 4.0</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">TechBlog 4.0</a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsMain" aria-controls="navbarsMain" aria-expanded="false" aria-label="Attiva navigazione">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarsMain">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Articoli</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Chi Siamo</a>
                        </li>
                    </ul>

                    <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                        <form class="d-flex w-100">
                            <input class="form-control rounded-pill border-0 px-3" type="search" placeholder="Cerca nel blog..." aria-label="Search">
                        </form>
                        
                        <a href="account.html" class="btn btn-warning rounded-circle p-2 d-flex align-items-center justify-content-center" title="Area Personale" style="width: 42px; height: 42px;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
                                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"></path>
                                <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"></path>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="fw-bold fs-2">Impostazioni Account</h1>
                <p class="text-muted">Gestisci le tue informazioni personali e le preferenze del profilo.</p>
            </div>
        </div>

        <div class="row g-4">
            
            <aside class="col-lg-3 col-md-4">
                <div class="list-group shadow-sm rounded-4 border-0">
                    <a href="#" class="list-group-item list-group-item-action active bg-dark border-dark py-3" aria-current="true">
                        Informazioni Profilo
                    </a>
                    <a href="#" class="list-group-item list-group-item-action py-3">Sicurezza & Password</a>
                    <a href="#" class="list-group-item list-group-item-action py-3 text-danger">Elimina Account</a>
                </div>
            </aside>
            
            <section class="col-lg-9 col-md-8">
                <div class="card shadow-sm border-0 rounded-4 mb-4">
                    <div class="card-body p-4 p-md-5">
                        <h3 class="fs-4 fw-bold mb-4 border-bottom pb-3">Dati Personali</h3>
                        
                        <form>
                            <div class="d-flex align-items-center mb-4">
                                <img src="https://ui-avatars.com/api/?name=Mario+Rossi&background=ffc107&color=000" alt="Avatar Utente" class="rounded-circle me-3 shadow-sm" width="80" height="80">
                                <div>
                                    <button type="button" class="btn btn-outline-dark btn-sm rounded-pill mb-1 fw-semibold">Carica foto</button>
                                </div>
                            </div>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="inputNome" class="form-label fw-semibold">Nome</label>
                                    <input type="text" class="form-control rounded-3" id="inputNome" value="Mario">
                                </div>
                                <div class="col-md-6">
                                    <label for="inputCognome" class="form-label fw-semibold">Cognome</label>
                                    <input type="text" class="form-control rounded-3" id="inputCognome" value="Rossi">
                                </div>
                                <div class="col-12">
                                    <label for="inputEmail" class="form-label fw-semibold">Indirizzo Email</label>
                                    <input type="email" class="form-control rounded-3" id="inputEmail" value="mario.rossi@example.com">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end mt-4">
                                <button type="submit" class="btn btn-dark rounded-pill px-4 fw-bold">Salva Modifiche</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p class="mb-0 small">&copy; 2024 TechBlog 4.0 - Esercitazione Scolastica</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
