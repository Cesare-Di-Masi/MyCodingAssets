<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task & Budget Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        /* Una piccola aggiunta personalizzata per l'animazione dell'alert */
        #budgetAlert {
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container py-5">
        <h1 class="text-center mb-5 text-primary">Smart Budget Manager</h1>

        <div class="row g-4">
            <div class="col-md-5">

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <h5 class="card-title mb-4">Nuova Spesa</h5>
                        <form id="budgetForm">
                            <div class="mb-3">
                                <label for="nomeTask" class="form-label">Nome Attività / Acquisto</label>
                                <input type="text" class="form-control" id="nomeTask"
                                    placeholder="es. Spesa alimentare">
                            </div>
                            <div class="mb-3">
                                <label for="costoTask" class="form-label">Costo Previsto (€)</label>
                                <input type="number" step="0.01" class="form-control" id="costoTask"
                                    placeholder="es. 45.50">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-plus-circle"></i> Aggiungi
                            </button>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body text-center">
                        <h5 class="card-title text-muted">Totale Spesa</h5>
                        <h2 id="totaleSpesa" class="fw-bold text-success mb-0">0.00 €</h2>

                        <div id="budgetAlert" class="alert alert-danger mt-3 d-none" role="alert">
                            <i class="bi bi-exclamation-triangle-fill"></i> Budget Superato!
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-4">Elenco Acquisti</h5>

                        <p id="emptyMessage" class="text-muted text-center my-4">Nessuna spesa registrata.</p>

                        <ul id="listaElementi" class="list-group list-group-flush">
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
