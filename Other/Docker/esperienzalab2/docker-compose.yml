services:
  web:
    image: php:8.2-apache
    container_name: bacheca_app_step1
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/src
    command: >
      bash -c "sed -i -e 's/html/html\\/src/g' /etc/apache2/sites-available/000-default.conf && apache2-foreground"
    restart: unless-stopped