services:
    web:
        image: php:8.2-apache
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html
        depends_on:
            - db

    db:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: rootpass
            MYSQL_DATABASE: my_database
            MYSQL_USER: user
            MYSQL_PASSWORD: password_segreta
        volumes:
            - db_data:/var/lib/mysql

volumes:
    db_data: