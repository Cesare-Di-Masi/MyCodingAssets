version: "3.8"
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ncc
      POSTGRES_PASSWORD: nccpass
      POSTGRES_DB: ncc
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-01-01T00-00-00Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ncc_backend
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - postgres
      - minio
    volumes:
      - ./backend:/srv/backend:ro
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: ncc_worker
    env_file: .env
    depends_on:
      - redis
      - postgres
    command: ["bash","/srv/backend/worker_entrypoint.sh"]
    volumes:
      - ./backend:/srv/backend
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
  minio-data:
